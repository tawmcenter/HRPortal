<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Choice — Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF4ED;
    --surface:#FFFFFF;
    --border:#E7DDD1;
    --text:#2B2420;
    --text-secondary:#8A7C6F;
    --accent:#E2661D;
    --accent-light:#FDEAD9;
    --accent-dark:#9A3E12;
    --danger:#A32D2D;
    --danger-bg:#FCEBEB;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .brand-mark{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--accent-dark);}
  .brand-sub{font-size:13px;color:var(--text-secondary);}
  .session-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px;color:var(--text-secondary);}
  .tabs{display:flex;gap:8px;margin-bottom:24px;}
  .tab-btn{flex:1;padding:10px 14px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;color:var(--text-secondary);cursor:pointer;}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .section-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0 0 4px;}
  .section-sub{font-size:13px;color:var(--text-secondary);margin:0 0 18px;}
  .divider{height:1px;background:var(--border);margin:26px 0;}
  button.submit{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-top:6px;}
  button.submit:disabled{opacity:0.5;cursor:not-allowed;}
  button.ghost{padding:8px 14px;background:var(--surface);color:var(--accent-dark);border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;}
  button.link{background:none;border:none;color:var(--accent-dark);font-size:13px;font-family:inherit;cursor:pointer;text-decoration:underline;padding:0;}
  .msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;display:none;}
  .msg.show{display:block;}
  .msg.success{background:var(--accent-light);color:var(--accent-dark);}
  .msg.error{background:var(--danger-bg);color:var(--danger);}
  .msg.notice{background:var(--accent-light);color:var(--accent-dark);}
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .login-card{max-width:380px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px;text-align:center;}
  .login-card .brand{justify-content:center;margin-bottom:2px;}
  .login-card p.section-sub{margin-bottom:20px;}
  .summary-row{display:flex;gap:12px;margin-bottom:20px;}
  .summary-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .summary-num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  .summary-label{font-size:12px;color:var(--text-secondary);margin-top:2px;}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .row:last-child{margin-bottom:0;}
  .rank{width:24px;height:24px;border-radius:50%;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
  .row-body{flex:1;min-width:0;}
  .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .row-name{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-count{color:var(--text-secondary);font-size:13px;flex-shrink:0;}
  .row-sub{font-size:12px;color:var(--text-secondary);margin-top:1px;}
  .bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .empty{color:var(--text-secondary);font-size:13px;padding:8px 0;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .loading{color:var(--text-secondary);font-size:13px;}
  .period-tag{font-size:12px;color:var(--accent-dark);background:var(--accent-light);padding:3px 10px;border-radius:999px;font-weight:500;}
</style>
</head>
<body>
<style>.wmhrga-back-fab{position:fixed;bottom:16px;left:16px;z-index:99999;display:inline-flex;align-items:center;gap:6px;background:#14213D;color:#fff;text-decoration:none;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:999px;box-shadow:0 6px 18px rgba(20,33,61,.35);transition:transform .15s ease,box-shadow .15s ease;}.wmhrga-back-fab:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,33,61,.45);}@media print{.wmhrga-back-fab{display:none;}}</style>
<a href="index.html" class="wmhrga-back-fab">&#8592; Dashboard</a>

<div class="wrap">

  <div id="viewLogin" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="brand-mark">We Choice</span></div>
      <p class="section-sub">Masukkan email kamu untuk masuk dan mulai vote.</p>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="nama@email.com" required>
      </div>
      <button type="button" class="submit" id="loginBtn">Masuk</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <div id="viewApp" style="display:none;">
    <div class="brand">
      <span class="brand-mark">We Choice</span>
      <span class="brand-sub">Recognition vote</span>
    </div>
    <div class="session-bar">
      <span id="sessionEmail"></span>
      <button type="button" class="link" id="logoutBtn">Keluar</button>
    </div>

    <div class="tabs">
      <button id="tabFormBtn" class="tab-btn active" type="button">Isi form</button>
      <button id="tabDashBtn" class="tab-btn" type="button">Dashboard</button>
      <button id="tabHofBtn" class="tab-btn" type="button">Hall of fame</button>
    </div>

    <div id="viewForm">
      <form id="voteForm" class="card">
        <p class="section-title">Data diri</p>
        <p class="section-sub">Isi data kamu sebelum vote.</p>

        <div class="field">
          <label for="pNama">Nama</label>
          <input type="text" id="pNama" required>
        </div>
        <div class="field">
          <label for="pPosisi">Posisi</label>
          <input type="text" id="pPosisi" placeholder="contoh: Fisioterapis" required>
        </div>
        <div class="field">
          <label for="pCabang">Cabang</label>
          <select id="pCabang" required></select>
        </div>

        <div class="divider"></div>

        <p class="section-title">Vote</p>
        <p class="section-sub">Pilih 1 rekan kerja yang menurutmu paling layak diapresiasi bulan ini.</p>

        <div class="field">
          <label for="vNama">Nama yang dipilih</label>
          <input type="text" id="vNama" required>
        </div>
        <div class="field">
          <label for="vPosisi">Posisi</label>
          <input type="text" id="vPosisi" placeholder="contoh: Front office" required>
        </div>
        <div class="field">
          <label for="vCabang">Cabang</label>
          <select id="vCabang" required></select>
        </div>

        <button type="submit" class="submit" id="submitBtn">Kirim vote</button>
        <div id="formMsg" class="msg"></div>
      </form>
    </div>

    <div id="viewDash" style="display:none;">
      <div class="toolbar">
        <span class="loading" id="dashStatus">Memuat data...</span>
        <button class="ghost" id="refreshBtn" type="button">Refresh</button>
      </div>
      <div id="dashSummary"></div>
      <div id="dashContent"></div>
    </div>

    <div id="viewHof" style="display:none;">
      <div class="toolbar">
        <span class="loading" id="hofStatus">Memuat data...</span>
        <button class="ghost" id="hofRefreshBtn" type="button">Refresh</button>
      </div>
      <div id="hofContent"></div>
    </div>
  </div>

</div>

<script>
// GANTI URL DI BAWAH INI dengan URL deployment Apps Script kamu (.../exec)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3QuiM_T9C5Spxn5O8i_4F4mE736ltSq12y4z2pk3XSMzRV3KCcm2NttUZPWO-pnj9dw/exec';

const CABANG_OPTIONS = ['Kuningan', 'BSD', 'Kebayoran', 'Cibubur', 'Bandung', 'Surabaya', 'Kemang', 'Puri', 'Alam Sutra', 'Bekasi', 'Pemuda', 'Head Office'];

function fillCabang(select) {
  select.innerHTML = '<option value="" disabled selected>Pilih cabang</option>' +
    CABANG_OPTIONS.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
}
fillCabang(document.getElementById('pCabang'));
fillCabang(document.getElementById('vCabang'));

let currentEmail = null;

const viewLogin = document.getElementById('viewLogin');
const viewApp = document.getElementById('viewApp');
const loginBtn = document.getElementById('loginBtn');
const loginEmail = document.getElementById('loginEmail');
const loginMsg = document.getElementById('loginMsg');
const sessionEmail = document.getElementById('sessionEmail');
const logoutBtn = document.getElementById('logoutBtn');
const submitBtn = document.getElementById('submitBtn');
const formMsg = document.getElementById('formMsg');

function showLoginMsg(text, type) {
  loginMsg.textContent = text;
  loginMsg.className = 'msg show ' + type;
}

let jsonpCounter = 0;
function jsonpFetch(url) {
  return new Promise(function(resolve, reject) {
    const callbackName = 'jsonp_cb_' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;

    const cleanup = function() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    window[callbackName] = function(data) {
      settled = true;
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      if (!settled) { cleanup(); reject(new Error('Gagal memuat data dari Apps Script')); }
    };

    const separator = url.indexOf('?') === -1 ? '?' : '&';
    script.src = url + separator + 'callback=' + callbackName;
    document.body.appendChild(script);

    setTimeout(function() {
      if (!settled) { cleanup(); reject(new Error('Timeout memuat data')); }
    }, 10000);
  });
}

async function checkAlreadyVoted(email) {
  try {
    const json = await jsonpFetch(APPS_SCRIPT_URL + '?checkEmail=' + encodeURIComponent(email));
    return json.alreadyVoted === true;
  } catch (err) {
    return false;
  }
}

loginBtn.addEventListener('click', async function() {
  const email = loginEmail.value.trim().toLowerCase();
  if (!email || !email.includes('@')) {
    showLoginMsg('Masukkan email yang valid.', 'error');
    return;
  }
  loginBtn.disabled = true;
  loginMsg.className = 'msg';

  currentEmail = email;
  sessionEmail.textContent = 'Masuk sebagai: ' + email;
  viewLogin.style.display = 'none';
  viewApp.style.display = '';
  loginBtn.disabled = false;

  const alreadyVoted = await checkAlreadyVoted(email);
  if (alreadyVoted) {
    formMsg.textContent = 'Kamu sudah vote bulan ini menggunakan email ini. Bulan depan bisa vote lagi. Kamu masih bisa lihat dashboard.';
    formMsg.className = 'msg show notice';
    submitBtn.disabled = true;
  }
});

logoutBtn.addEventListener('click', function() {
  currentEmail = null;
  loginEmail.value = '';
  submitBtn.disabled = false;
  formMsg.className = 'msg';
  viewApp.style.display = 'none';
  viewLogin.style.display = '';
  tabFormBtn.click();
});

const tabFormBtn = document.getElementById('tabFormBtn');
const tabDashBtn = document.getElementById('tabDashBtn');
const tabHofBtn = document.getElementById('tabHofBtn');
const viewForm = document.getElementById('viewForm');
const viewDash = document.getElementById('viewDash');
const viewHof = document.getElementById('viewHof');

function setActiveTab(btn) {
  [tabFormBtn, tabDashBtn, tabHofBtn].forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  viewForm.style.display = btn === tabFormBtn ? '' : 'none';
  viewDash.style.display = btn === tabDashBtn ? '' : 'none';
  viewHof.style.display = btn === tabHofBtn ? '' : 'none';
}

tabFormBtn.addEventListener('click', function() {
  setActiveTab(tabFormBtn);
});
tabDashBtn.addEventListener('click', function() {
  setActiveTab(tabDashBtn);
  loadDashboard();
});
tabHofBtn.addEventListener('click', function() {
  setActiveTab(tabHofBtn);
  loadHallOfFame();
});
document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
document.getElementById('hofRefreshBtn').addEventListener('click', loadHallOfFame);

const form = document.getElementById('voteForm');

function showFormMsg(text, type) {
  formMsg.textContent = text;
  formMsg.className = 'msg show ' + type;
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  if (!currentEmail) return;
  submitBtn.disabled = true;
  formMsg.className = 'msg';

  try {
    const alreadyVoted = await checkAlreadyVoted(currentEmail);
    if (alreadyVoted) {
      showFormMsg('Email ini sudah vote bulan ini. Satu email hanya bisa vote sekali per bulan.', 'error');
      return;
    }

    const record = {
      namaPeserta: document.getElementById('pNama').value.trim(),
      posisiPeserta: document.getElementById('pPosisi').value.trim(),
      cabangPeserta: document.getElementById('pCabang').value,
      email: currentEmail,
      namaVote: document.getElementById('vNama').value.trim(),
      posisiVote: document.getElementById('vPosisi').value.trim(),
      cabangVote: document.getElementById('vCabang').value
    };

    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record)
    });

    showFormMsg('Vote kamu berhasil dikirim. Terima kasih!', 'success');
    form.reset();
    fillCabang(document.getElementById('pCabang'));
    fillCabang(document.getElementById('vCabang'));
    submitBtn.disabled = true;
  } catch (err) {
    showFormMsg('Terjadi kendala saat mengirim vote (' + err.message + '). Coba lagi sebentar lagi.', 'error');
    submitBtn.disabled = false;
  }
});

async function loadDashboard() {
  const status = document.getElementById('dashStatus');
  const summaryEl = document.getElementById('dashSummary');
  const contentEl = document.getElementById('dashContent');
  status.textContent = 'Memuat data...';
  contentEl.innerHTML = '';
  summaryEl.innerHTML = '';

  try {
    const json = await jsonpFetch(APPS_SCRIPT_URL);
    const rows = json.data || [];

    const now = new Date();
    const records = rows.filter(function(r) {
      const d = new Date(r.timestamp);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });

    const monthLabel = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    status.innerHTML = 'Periode <span class="period-tag">' + monthLabel + '</span>';
    renderDashboard(records, summaryEl, contentEl);
  } catch (err) {
    status.textContent = '';
    contentEl.innerHTML = '<p class="empty">Gagal memuat data dashboard. Pastikan URL Apps Script sudah benar.</p>';
  }
}

async function loadHallOfFame() {
  const status = document.getElementById('hofStatus');
  const contentEl = document.getElementById('hofContent');
  status.textContent = 'Memuat data...';
  contentEl.innerHTML = '';

  try {
    const json = await jsonpFetch(APPS_SCRIPT_URL + '?winners=1');
    const winners = (json.winners || []).slice().reverse();

    status.textContent = 'Arsip pemenang dari semua periode';

    if (winners.length === 0) {
      contentEl.innerHTML = '<p class="empty">Belum ada periode yang ditutup. Pemenang akan muncul di sini setelah bulan berjalan ditutup lewat menu di Google Sheet.</p>';
      return;
    }

    let html = '<div class="chart-card">';
    winners.forEach(function(w) {
      html +=
        '<div class="row">' +
          '<div class="rank">&#127942;</div>' +
          '<div class="row-body">' +
            '<div class="row-top"><span class="row-name">' + w.nama + '</span><span class="period-tag">' + w.periode + '</span></div>' +
            '<div class="row-sub">' + w.kategori + ' &middot; ' + w.cabang + ' &middot; ' + w.jumlahSuara + ' suara</div>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
    contentEl.innerHTML = html;
  } catch (err) {
    status.textContent = '';
    contentEl.innerHTML = '<p class="empty">Gagal memuat data Hall of Fame.</p>';
  }
}

function renderDashboard(records, summaryEl, contentEl) {
  const totalCandidates = {};
  records.forEach(function(rec) {
    const key = rec.namaVote.toLowerCase() + '|' + rec.cabangVote;
    if (!totalCandidates[key]) {
      totalCandidates[key] = { nama: rec.namaVote, posisi: rec.posisiVote, cabang: rec.cabangVote, count: 0 };
    }
    totalCandidates[key].count += 1;
  });

  const entries = Object.values(totalCandidates).sort(function(a, b) { return b.count - a.count; });

  summaryEl.innerHTML =
    '<div class="summary-row">' +
      '<div class="summary-card"><div class="summary-num">' + records.length + '</div><div class="summary-label">Total suara bulan ini</div></div>' +
      '<div class="summary-card"><div class="summary-num">' + entries.length + '</div><div class="summary-label">Kandidat menerima suara</div></div>' +
    '</div>';

  if (entries.length === 0) {
    contentEl.innerHTML = '<p class="empty">Belum ada vote bulan ini.</p>';
    return;
  }

  const max = entries[0].count;
  let html = '<div class="chart-card">';
  entries.forEach(function(entry, idx) {
    const pct = Math.round((entry.count / max) * 100);
    html +=
      '<div class="row">' +
        '<div class="rank">' + (idx + 1) + '</div>' +
        '<div class="row-body">' +
          '<div class="row-top"><span class="row-name">' + entry.nama + '</span><span class="row-count">' + entry.count + ' suara</span></div>' +
          '<div class="row-sub">' + entry.posisi + ' &middot; ' + entry.cabang + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>' +
        '</div>' +
      '</div>';
  });
  html += '</div>';

  contentEl.innerHTML = html;
}
</script>
</body>
</html>
