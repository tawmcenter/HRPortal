<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Peringatan &amp; Teguran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#0e2b28; --ink-soft:#3d5652; --muted:#6b827e;
    --brand:#0f766e; --brand-600:#0d8f83; --brand-050:#e7f2f0;
    --bg:#f3f7f6; --surface:#ffffff; --line:#e0ebe8; --line-strong:#c9dcd8;
    --ok:#0f9d6f; --ok-bg:#e6f6ef; --ok-line:#bfe8d7;
    --danger:#d02525; --danger-bg:#fbe9e9; --danger-line:#f3c8c8;
    --radius:14px; --shadow:0 1px 2px rgba(14,43,40,.04),0 10px 30px rgba(14,43,40,.06);
    --font-d:'Plus Jakarta Sans',system-ui,sans-serif;
    --font-b:'Inter',system-ui,sans-serif;
    --sidebar-w:256px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-b);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.font-display{font-family:var(--font-d);letter-spacing:-.01em;color:var(--ink);}
  a{color:var(--brand);}
  input,select,textarea,button{font-family:var(--font-b);}

  /* ---------- SIDEBAR ---------- */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,var(--ink) 0%, #123833 100%);color:#fff;display:flex;flex-direction:column;z-index:20;}
  .sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sb-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--brand),#0b5c55);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:14px;color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.35);}
  .sb-title{font-family:var(--font-d);font-weight:700;font-size:14.5px;line-height:1.2;}
  .sb-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;}
  .sb-nav{padding:16px 12px;flex:1;}
  .sb-section-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:6px 10px 8px;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.72);cursor:pointer;margin-bottom:2px;transition:background .12s ease,color .12s ease;}
  .sb-item svg{flex-shrink:0;opacity:.85;}
  .sb-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .sb-item.active{background:var(--brand);color:#fff;}
  .sb-item.active svg{opacity:1;}
  .sb-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);}
  .sb-role-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px;}
  .role-toggle{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px;}
  .role-toggle button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:600;padding:7px 0;border-radius:6px;cursor:pointer;}
  .role-toggle button.active{background:#fff;color:var(--ink);}
  .role-switch-btn{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);font-size:12.5px;font-weight:600;padding:8px 0;border-radius:8px;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .role-switch-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
  .sb-role-current{font-size:13px;font-weight:600;color:#fff;margin-bottom:10px;}

  /* ── LAYAR PILIH PERAN (tampilan pertama saat halaman dibuka) ── */
  body.role-gate .sidebar{display:none;}
  body.role-gate .main{margin-left:0;}
  body.role-gate .topbar{display:none;}
  body.role-gate .sb-toggle{display:none;}
  .gate-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;}
  .gate-mark{width:56px;height:56px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;letter-spacing:.5px;margin-bottom:22px;}
  .gate-screen h1{font-size:23px;margin:0 0 8px;letter-spacing:-.01em;}
  .gate-screen .gate-sub{font-size:13.5px;color:var(--muted);margin:0 0 32px;max-width:420px;line-height:1.6;}
  .gate-options{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:620px;}
  .gate-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:26px 22px;cursor:pointer;text-align:left;transition:border-color .16s,box-shadow .16s,transform .16s;font-family:inherit;}
  .gate-card:hover{border-color:var(--brand);box-shadow:0 10px 28px rgba(0,0,0,.09);transform:translateY(-2px);}
  .gate-card:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}
  .gate-icon{width:42px;height:42px;border-radius:12px;background:var(--brand-050);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .gate-card h3{font-size:15.5px;margin:0 0 6px;}
  .gate-card p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6;}
  .gate-card .gate-note{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.05);color:var(--muted);}
  @media(max-width:640px){
    .gate-options{grid-template-columns:1fr;}
    .gate-screen{padding:32px 16px;}
    .gate-screen h1{font-size:20px;}
  }
  .sync-status{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);cursor:pointer;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .sync-status:hover{background:rgba(255,255,255,.1);}

  /* ---------- MAIN ---------- */
  .main{margin-left:var(--sidebar-w);min-height:100vh;}
  .topbar{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 32px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  .page-title{font-family:var(--font-d);font-weight:700;font-size:19px;color:var(--ink);}
  .page-desc{font-size:13px;color:var(--muted);margin-top:3px;max-width:580px;}
  .content{padding:26px 32px 56px;}
  .banner{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:18px;border:1px solid transparent;}
  .banner-warn{background:#fdf3e2;color:#8a5a06;border-color:#f2ddac;}
  .banner-ok{background:var(--ok-bg);color:#0a7a56;border-color:var(--ok-line);}

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .stat-card{padding:16px 18px;}
  .stat-label{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .stat-value{font-family:var(--font-d);font-weight:700;font-size:24px;color:var(--ink);}

  .template-card{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:18px;background:var(--brand-050);border:1px solid #cfe6e2;}
  .template-icon{width:42px;height:42px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--brand);flex-shrink:0;box-shadow:var(--shadow);}
  .template-title{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--ink);}
  .template-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  table{border-collapse:collapse;width:100%;}
  thead th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 16px;white-space:nowrap;background:#FAFCFB;border-bottom:1px solid var(--line);}
  tbody td{padding:13px 16px;font-size:13.5px;color:var(--ink);border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFCFB;}
  .cell-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .cell-muted{color:var(--muted);}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent;}
  .badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line);}
  .badge-ok .badge-dot{background:var(--ok);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line);}
  .badge-danger .badge-dot{background:var(--danger);}

  .btn{font-family:var(--font-b);font-weight:600;font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .13s ease;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(15,118,110,.22);}
  .btn-primary:hover{background:var(--brand-600);transform:translateY(-1px);}
  .btn-outline{background:#fff;color:var(--ink);border-color:var(--line-strong);}
  .btn-outline:hover{background:#F7FAF9;border-color:var(--brand);color:var(--brand);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-disabled{background:#EEF2F1;color:var(--muted);cursor:not-allowed;border-color:var(--line);}
  .btn-link-sm{font-size:12px;font-weight:600;color:var(--brand);cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .btn-link-sm:hover{text-decoration:underline;}

  .icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .12s ease;}
  .icon-btn:hover{background:#F5FAF9;border-color:var(--brand);color:var(--brand);}

  input[type=text],input[type=date],select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line-strong);border-radius:10px;font-size:13.5px;font-family:var(--font-b);background:#fcfefe;color:var(--ink);transition:.13s;}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.13);background:#fff;}
  input:disabled,textarea:disabled{background:#F4F6F5;color:var(--ink-soft);}
  ::placeholder{color:#a7b6b2;}
  label.field-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px;}
  .field-hint{font-size:11.5px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;margin-top:5px;}

  .section-title{font-family:var(--font-d);font-weight:700;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:10px;}
  .section-num{width:26px;height:26px;border-radius:8px;background:var(--brand-050);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(14,43,40,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
  .progress-track{height:7px;border-radius:99px;background:#E9EFEE;overflow:hidden;}
  .progress-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .4s ease;}
  .file-drop{border:1.5px dashed var(--line-strong);border-radius:11px;padding:15px;background:#fbfdfd;text-align:left;}
  .file-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfdfd;font-size:13px;}
  .empty-state{text-align:center;padding:56px 20px;color:var(--muted);}
  .divider{border-top:1px solid var(--line);}

  .pagination{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;flex-wrap:wrap;border-top:1px solid var(--line);}
  .pagination-info{font-size:12.5px;color:var(--muted);}
  .pagination-pages{display:flex;align-items:center;gap:4px;}
  .page-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .page-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
  .page-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}
  .page-ellipsis{color:var(--muted);font-size:12.5px;padding:0 2px;}

  .login-gate{max-width:400px;margin:60px auto;text-align:center;padding:36px 30px;}
  .login-gate .login-icon{width:52px;height:52px;border-radius:14px;background:var(--brand-050);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .login-gate h2{font-size:17px;margin-bottom:6px;}
  .login-gate p{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6;}
  .login-gate-btn-wrap{display:flex;justify-content:center;}
  .login-denied{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger);border-radius:10px;padding:12px 14px;font-size:12.5px;text-align:left;margin-top:16px;line-height:1.6;}
  .hr-account-chip{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.06);margin-bottom:8px;}
  .hr-account-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .hr-account-chip .email{font-size:11px;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .hr-signout{font-size:11px;color:rgba(255,255,255,.5);cursor:pointer;flex-shrink:0;}
  .hr-signout:hover{color:#fff;}

  /* ---------- MODUL SURAT PERINGATAN & TEGURAN ---------- */
  .sp-sev-sp1{--sev:#d19a00;} .sp-sev-sp2{--sev:#e2620d;} .sp-sev-sp3{--sev:#d02525;}
  .sp-sev-teguran{--sev:#0e7490;} .sp-sev-phk{--sev:#7d1a2f;} .sp-sev-other{--sev:#64748b;}

  .sp-chips{display:flex;flex-wrap:wrap;gap:9px;}
  .sp-chip{position:relative;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:999px;background:#fcfefe;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;user-select:none;}
  .sp-chip:hover{border-color:var(--brand);}
  .sp-chip input{position:absolute;opacity:0;pointer-events:none;}
  .sp-chip .box{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;}
  .sp-chip.on{background:var(--brand-050);border-color:var(--brand);color:#0b5c55;}
  .sp-chip.on .box{background:var(--brand);border-color:var(--brand);}
  .sp-chip.on .box::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);}

  .sp-jenis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .sp-jenis{position:relative;border:1.5px solid var(--line-strong);border-radius:11px;padding:13px 12px;cursor:pointer;transition:.15s;background:#fcfefe;}
  .sp-jenis:hover{border-color:var(--sev);}
  .sp-jenis input{position:absolute;opacity:0;}
  .sp-jenis .tag{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sev);margin-bottom:7px;}
  .sp-jenis .name{display:block;font-family:var(--font-d);font-weight:700;font-size:14px;line-height:1.15;}
  .sp-jenis .sub{font-size:11px;color:var(--muted);}
  .sp-jenis.on{border-color:var(--sev);background:color-mix(in srgb,var(--sev) 8%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--sev) 16%,transparent);}

  .sp-reveal{margin-top:10px;display:none;}.sp-reveal.show{display:block;}
  .ac-wrap{position:relative;}
  .ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:230px;overflow-y:auto;box-shadow:var(--shadow);z-index:60;display:none;}
  .ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--brand-050);}
  .ac-name{font-size:13.5px;font-weight:500;color:var(--ink);}
  .ac-match{color:var(--brand-600);font-weight:700;}
  .ac-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .sp-stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
  .sp-stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 14px 12px;box-shadow:var(--shadow);border-top:3px solid var(--sev);}
  .sp-stat .lbl{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .sp-stat .lbl .d{width:7px;height:7px;border-radius:50%;background:var(--sev);flex-shrink:0;}
  .sp-stat .num{font-family:var(--font-d);font-weight:800;font-size:24px;line-height:1;margin:7px 0 2px;}
  .sp-stat .pct{font-size:11px;color:var(--muted);}

  .sp-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .sp-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;}
  .sp-panel.full{grid-column:1/-1;}
  .sp-panel h3{font-size:14.5px;margin-bottom:2px;}
  .sp-panel .ph{font-size:11.5px;color:var(--muted);margin-bottom:14px;}

  .sp-donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .sp-donut{width:140px;height:140px;flex:none;}
  .sp-dn-num{font-family:var(--font-d);font-weight:800;font-size:23px;fill:var(--ink);text-anchor:middle;}
  .sp-dn-lbl{font-size:8px;fill:var(--muted);text-anchor:middle;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .sp-donut-legend{display:flex;flex-direction:column;gap:9px;min-width:140px;flex:1;}
  .sp-dl-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);}
  .sp-dl-item i{width:10px;height:10px;border-radius:3px;flex:none;}
  .sp-dl-item b{font-weight:600;flex:1;white-space:nowrap;}
  .sp-dl-item em{font-style:normal;color:var(--muted);font-size:11.5px;}

  .sp-bars{display:flex;flex-direction:column;gap:11px;}
  .sp-bar-row{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;}
  .sp-bar-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sp-bar-track{height:22px;background:#eef4f3;border-radius:6px;overflow:hidden;}
  .sp-bar-fill{height:100%;border-radius:6px;min-width:3px;transition:width .5s ease;display:flex;}
  .sp-bar-seg{height:100%;}
  .sp-bar-val{font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}

  .sp-colorkey{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:18px;box-shadow:var(--shadow);font-size:11.5px;color:var(--ink-soft);}
  .sp-colorkey .kt{font-weight:700;color:var(--ink);}
  .sp-colorkey span.k{display:inline-flex;align-items:center;gap:6px;}
  .sp-colorkey i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .sp-empty-mini{color:var(--muted);font-size:12.5px;padding:12px 0;text-align:center;width:100%;}
  /* ---------- ALUR PERSETUJUAN ---------- */
  .font-medium{font-weight:600;}
  .btn-danger{background:var(--danger);color:#fff;box-shadow:0 6px 14px rgba(208,37,37,.2);}
  .btn-danger:hover{background:#b81f1f;}
  .btn:disabled{opacity:.6;cursor:wait;transform:none;}
  .sp-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .sp-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

function acHighlight(name, q){
  if(!q) return esc(name);
  const idx = name.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return esc(name);
  const before = name.slice(0, idx), match = name.slice(idx, idx + q.length), after = name.slice(idx + q.length);
  return esc(before) + '<span class="ac-match">' + esc(match) + '</span>' + esc(after);
}

function acApplyCabang(selectId, otherInputId, revealFn, penempatan){
  const select = document.getElementById(selectId);
  if(!select) return;
  const opts = Array.from(select.options).map(o => o.value).filter(v => v && v !== "__other");
  if(opts.includes(penempatan)){
    select.value = penempatan;
  } else {
    select.value = "__other";
    if(otherInputId){ const oi = document.getElementById(otherInputId); if(oi) oi.value = penempatan; }
  }
  if(revealFn && typeof window[revealFn] === "function") window[revealFn]();
}

 *  - posisi, divisi, penempatan: id field teks yang diisi otomatis
 *  - cabangSelect, cabangOtherInput, cabangRevealFn: untuk form yang pakai
 *    dropdown Cabang (bukan field Penempatan bebas teks)
 */
function setupEmployeeAutocomplete(nameId, cfg){
  cfg = cfg || {};
  const input = document.getElementById(nameId);
  const list = document.getElementById(nameId + "_ac");
  if(!input || !list) return;

  function matches(q){ return EMPLOYEES.filter(e => e.n.toLowerCase().includes(q)).slice(0, 8); }

  function show(q){
    const found = matches(q);
    if(found.length === 0){ list.style.display = "none"; list.innerHTML = ""; return; }
    list.innerHTML = found.map((e, i) => `
      <div class="ac-item" data-i="${i}">
        <div class="ac-name">${acHighlight(e.n, q)}</div>
        <div class="ac-sub">${esc(e.p)} &middot; ${esc(e.j)}</div>
      </div>
    `).join("");
    Array.from(list.children).forEach((el, i) => {
      el.addEventListener("mousedown", (ev) => { ev.preventDefault(); pick(found[i]); });
    });
    list.style.display = "block";
  }

  function pick(emp){
    input.value = emp.n;
    list.style.display = "none";
    if(cfg.posisi && document.getElementById(cfg.posisi)) document.getElementById(cfg.posisi).value = emp.j;
    if(cfg.divisi && document.getElementById(cfg.divisi)) document.getElementById(cfg.divisi).value = emp.d;
    if(cfg.penempatan && document.getElementById(cfg.penempatan)) document.getElementById(cfg.penempatan).value = emp.p;
    if(cfg.cabangSelect) acApplyCabang(cfg.cabangSelect, cfg.cabangOtherInput, cfg.cabangRevealFn, emp.p);
  }

  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if(!q){ list.style.display = "none"; return; }
    show(q);
  });
  input.addEventListener("focus", () => {
    const q = input.value.trim().toLowerCase();
    if(q) show(q);
  });
  input.addEventListener("blur", () => setTimeout(() => { list.style.display = "none"; }, 120));
}

/* ---------- GOOGLE SIGN-IN (GATE UNTUK LAYER 1 / HR) ---------- */
function decodeJwt(token){
  try{
    const payload = token.split(".")[1];
    const base64 = payload.replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c => '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

async function handleGoogleSignIn(response){
  const payload = decodeJwt(response.credential);
  if(!payload || !payload.email){
    alert("Gagal membaca informasi akun Google. Coba lagi.");
    return;
  }
  state.googleIdToken = response.credential;
  state.googleEmail = payload.email;
  state.hrAuthorized = ALLOWED_HR_EMAILS.map(e=>e.toLowerCase()).includes(payload.email.toLowerCase());
  render();
  if(state.hrAuthorized && SHEETS_API_URL){ await loadFromSheets(); render(); }
}

function googleSignOut(){
  if(state.modalId) spCloseModal();
  state.googleIdToken = null;
  state.googleEmail = null;
  state.hrAuthorized = false;
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.disableAutoSelect();
  }
  render();
}

function isGoogleSignInReady(){
  return !!(window.google && google.accounts && google.accounts.id && GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf("PASTE_") !== 0);
}

function renderGoogleButton(tries){
  tries = tries || 0;
  const el = document.getElementById("googleSignInBtn");
  if(!el) return;
  if(!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.indexOf("PASTE_") === 0){
    el.innerHTML = `<div class="login-denied">Google Sign-In belum dikonfigurasi. Tempel GOOGLE_CLIENT_ID yang valid di kode dashboard.</div>`;
    return;
  }
  // Script Google dimuat async: tunggu sampai siap (maks ~15 detik)
  if(!isGoogleSignInReady()){
    if(tries < 75){
      if(!el.innerHTML) el.innerHTML = `<div class="cell-muted" style="font-size:12.5px;">Memuat tombol login Google&hellip;</div>`;
      setTimeout(() => renderGoogleButton(tries + 1), 200);
    } else {
      el.innerHTML = `<div class="login-denied">Tombol login Google gagal dimuat. Periksa koneksi internet atau ekstensi pemblokir iklan, lalu muat ulang halaman.</div>`;
    }
    return;
  }
  el.innerHTML = "";
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleSignIn });
  google.accounts.id.renderButton(el, { theme: "outline", size: "large", text: "signin_with", shape: "pill", width: 260 });
}

/* ---------- GOOGLE SHEETS SYNC LAYER ---------- */
async function loadFromSheets(){
  if(!SHEETS_API_URL) return;
  state.syncing = true; renderSyncStatus();
  try{
    const tok = state.googleIdToken ? `&idToken=${encodeURIComponent(state.googleIdToken)}` : "";
    const res = await fetch(`${SHEETS_API_URL}?_ts=${Date.now()}${tok}`, {cache:'no-store'});
    const data = await res.json();
    if(data && data.authError){
      state.syncing = false; renderSyncStatus();
      alert(data.error);
      googleSignOut();
      return;
    }
    if(data && data.error){ throw new Error(data.error); }
    if(data && Array.isArray(data.suratTindakan)){
      STORAGE.suratTindakan = data.suratTindakan;
    }
    state.connected = true;
    state.loadError = "";
  }catch(err){
    console.error("Gagal memuat dari Sheets:", err);
    state.connected = false;
    state.loadError = (err && err.message) ? err.message : "Tidak bisa terhubung ke server.";
  }
  state.syncing = false; renderSyncStatus();
}

async function postToSheets(action, payload){
  if(!SHEETS_API_URL) return null;
  try{
    const res = await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({ action, ...payload })
    });
    return await res.json();
  }catch(err){
    console.error("Gagal mengirim ke Sheets:", err);
    return null;
  }
}

/* ---------- PAGINATION HELPERS ---------- */
function paginate(arr, page){
  const total = arr.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const safePage = Math.min(Math.max(1, page), pages);
  const start = (safePage - 1) * PAGE_SIZE;
  return { rows: arr.slice(start, start + PAGE_SIZE), total, pages, page: safePage, start };
}

function pageButtons(pages, current){
  let nums = [];
  if(pages <= 7){
    nums = Array.from({length:pages}, (_,i)=>i+1);
  } else {
    nums = [1];
    if(current > 3) nums.push("...");
    for(let p = Math.max(2,current-1); p <= Math.min(pages-1,current+1); p++) nums.push(p);
    if(current < pages-2) nums.push("...");
    nums.push(pages);
  }
  return nums;
}

function renderPagination(target, pageInfo, currentPage, onPageFn){
  if(pageInfo.total === 0) return "";
  const nums = pageButtons(pageInfo.pages, pageInfo.page);
  const btns = nums.map(n => n === "..."
    ? `<span class="page-ellipsis">&hellip;</span>`
    : `<button class="page-btn ${n===pageInfo.page ? 'active':''}" onclick="${onPageFn}(${n})">${n}</button>`
  ).join("");
  return `
    <div class="pagination">
      <div class="pagination-info">Menampilkan ${pageInfo.start+1}&ndash;${Math.min(pageInfo.start+PAGE_SIZE, pageInfo.total)} dari ${pageInfo.total} data</div>
      <div class="pagination-pages">
        <button class="page-btn" ${pageInfo.page<=1?'disabled':''} onclick="${onPageFn}(${pageInfo.page-1})">&lsaquo;</button>
        ${btns}
        <button class="page-btn" ${pageInfo.page>=pageInfo.pages?'disabled':''} onclick="${onPageFn}(${pageInfo.page+1})">&rsaquo;</button>
      </div>
    </div>
  `;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDateTime(s){
  if(!s) return "-";
  const dt = new Date(String(s).replace(" ", "T"));
  if(isNaN(dt)) return esc(s);
  return dt.toLocaleDateString("id-ID", {day:"2-digit", month:"short", year:"numeric"}) + ", " + dt.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
}
async function copyText(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove();
  }
  if(btn){
    const old = btn.innerHTML;
    btn.innerHTML = ok ? "Tersalin &#10003;" : "Gagal menyalin";
    setTimeout(() => { btn.innerHTML = old; }, 1600);
  }
}

/* Kode pengajuan terakhir dari perangkat ini (kemudahan untuk atasan) */
const MY_KODE_KEY = "wm_sp_kode_saya";
function bacaKodeSaya(){
  try{ const a = JSON.parse(localStorage.getItem(MY_KODE_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
function simpanKodeSaya(item){
  try{
    const a = bacaKodeSaya().filter(x => x.kode !== item.kode);
    a.unshift(item);
    localStorage.setItem(MY_KODE_KEY, JSON.stringify(a.slice(0, 10)));
  }catch(e){}
}

/* ---------- API (Sheets, atau simulasi kalau mode lokal) ---------- */
function localKode(){ const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for(let i=0;i<6;i++) s += c[Math.floor(Math.random()*c.length)]; return s; }
function localFindKode(k){
  const s = String(k||"").trim().toUpperCase(); const i = s.lastIndexOf("-");
  return STORAGE.suratTindakan.find(r => r.id.toUpperCase() === s.slice(0,i) && (r.kode||"").toUpperCase() === s.slice(i+1));
}
async function api(action, payload){
  if(SHEETS_API_URL){
    const res = await postToSheets(action, payload);
    if(res && res.authError){
      alert(res.error);
      googleSignOut();
      return null;
    }
    return res || { error: "Tidak ada respons dari server. Periksa koneksi lalu coba lagi." };
  }
  // ---- mode lokal (tanpa Sheets) ----
  const now = new Date().toISOString().slice(0,19);
  if(action === "submitSuratTindakan"){
    const id = "SP-" + (STORAGE.suratTindakan.length + 1), kode = localKode();
    STORAGE.suratTindakan.push({ id, timestamp: now, ...payload.data, tanggalSP:"", status: ST.PENDING, kode, revisiKe:"0", riwayat: now.replace("T"," ").slice(0,16) + " | " + payload.data.namaAtasan + " (atasan) | Diajukan" });
    return { ok:true, id, kode: id + "-" + kode, timestamp: now };
  }
  if(action === "cekPengajuan"){
    const r = localFindKode(payload.kode);
    return r ? { ok:true, pengajuan: r } : { error:"Kode pengajuan tidak ditemukan." };
  }
  if(action === "revisiSuratTindakan"){
    const r = localFindKode(payload.kode);
    if(!r) return { error:"Kode pengajuan tidak ditemukan." };
    Object.assign(r, payload.data, { status: ST.PENDING, revisiKe: String((+r.revisiKe||0)+1) });
    return { ok:true, id:r.id };
  }
  if(action === "reviewSuratTindakan"){
    const r = STORAGE.suratTindakan.find(x => x.id === payload.id);
    const map = { approve:ST.APPROVED, revise:ST.REVISI, reject:ST.REJECTED, reopen:ST.PENDING };
    Object.assign(r, { status: map[payload.decision], catatanHR: payload.catatan || "", reviewedBy: state.googleEmail || "hr (lokal)", reviewedAt: now });
    if(payload.decision === "approve"){ r.tanggalSP = payload.tanggalSP; r.berlakuSampai = payload.berlakuSampai || ""; r.nomorSurat = payload.nomorSurat || ""; if(payload.linkSurat) r.linkSurat = payload.linkSurat; }
    else { r.tanggalSP = ""; r.berlakuSampai = ""; r.nomorSurat = ""; }
    if(!r.kode) r.kode = localKode();
    return { ok:true, pengajuan: { ...r } };
  }
  if(action === "setLinkSurat"){
    const r = STORAGE.suratTindakan.find(x => x.id === payload.id);
    r.linkSurat = payload.linkSurat || "";
    return { ok:true, pengajuan: { ...r } };
  }
  return { error:"Aksi tidak dikenal." };
}

function spOnCabang(){
  document.getElementById("spCabangOther").classList.toggle("show", document.getElementById("sp_cabang").value === "__other");
}
function spOnJenis(){
  const checked = document.querySelector('input[name="sp_jenis"]:checked');
  const v = checked ? checked.value : "";
  document.querySelectorAll(".sp-jenis").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
  const hint = document.getElementById("spJenisHint");
  if(hint) hint.innerHTML = SP_TYPES.includes(v) ? `Masa SP dihitung sejak tanggal surat diterbitkan HR setelah pengajuan disetujui (biasanya ${SP_PERIOD_MONTHS} bulan).` : "";
}
function spOnAlasanOther(){
  document.getElementById("spAlasanOther").classList.toggle("show", document.querySelector("#spAlasanOtherChip input").checked);
}
function spAddMonths(dt, n){ const x = new Date(dt); x.setMonth(x.getMonth() + n); return x; }
function spFmtDateLong(s){
  const dt = s instanceof Date ? s : new Date(String(s).length === 10 ? s + "T00:00:00" : s);
  if(isNaN(dt)) return "-";
  const MONTHS_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return dt.getDate() + " " + MONTHS_ID[dt.getMonth()] + " " + dt.getFullYear();
}

document.addEventListener("change", (e) => {
  if(e.target.closest && e.target.closest("#spAlasanChips")){
    const chip = e.target.closest(".sp-chip");
    if(chip) chip.classList.toggle("on", e.target.checked);
  }
});

function spGetAlasan(){
  const arr = [];
  document.querySelectorAll("#spAlasanChips input:checked").forEach(c => {
    if(c.value === "__other"){
      const o = document.getElementById("sp_alasanOther").value.trim();
      if(o) arr.push(o);
    } else {
      arr.push(c.value);
    }
  });
  return arr;
}
function spGetCabang(){
  const v = document.getElementById("sp_cabang").value;
  return v === "__other" ? document.getElementById("sp_cabangOther").value.trim() : v;
}
function spGetJenis(){
  const checked = document.querySelector('input[name="sp_jenis"]:checked');
  return checked ? checked.value : "";
}

// Isi ulang form dengan data pengajuan (dipakai saat revisi)
function spFillForm(d){
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v || ""; };
  set("sp_namaAtasan", d.namaAtasan); set("sp_posisiAtasan", d.posisiAtasan); set("sp_divisiAtasan", d.divisiAtasan);
  set("sp_namaKaryawan", d.namaKaryawan); set("sp_posisiKaryawan", d.posisiKaryawan); set("sp_divisiKaryawan", d.divisiKaryawan);
  set("sp_detail", d.detail);
  const sel = document.getElementById("sp_cabang");
  if(d.cabang && SP_CABANG_OPTIONS.includes(d.cabang)){ sel.value = d.cabang; }
  else if(d.cabang){ sel.value = "__other"; set("sp_cabangOther", d.cabang); }
  spOnCabang();
  const radio = document.querySelector(`input[name="sp_jenis"][value="${CSS.escape(d.jenis || "")}"]`);
  if(radio){ radio.checked = true; spOnJenis(); }
  const parts = String(d.alasan || "").split(",").map(s => s.trim()).filter(Boolean);
  const others = [];
  parts.forEach(p => {
    const cb = Array.from(document.querySelectorAll("#spAlasanChips input")).find(c => c.value === p);
    if(cb){ cb.checked = true; cb.closest(".sp-chip").classList.add("on"); } else { others.push(p); }
  });
  if(others.length){
    const oc = document.querySelector("#spAlasanOtherChip input");
    oc.checked = true; oc.closest(".sp-chip").classList.add("on");
    set("sp_alasanOther", others.join(", "));
    spOnAlasanOther();
  }
}

function spBatalRevisi(){
  state.revisi = null;
  setView("sp-status");
}

function attachSPFormHandlers(){
  const form = document.getElementById("spForm");
  if(!form) return;

  setupEmployeeAutocomplete("sp_namaAtasan", { posisi: "sp_posisiAtasan", divisi: "sp_divisiAtasan" });
  setupEmployeeAutocomplete("sp_namaKaryawan", {
    posisi: "sp_posisiKaryawan", divisi: "sp_divisiKaryawan",
    cabangSelect: "sp_cabang", cabangOtherInput: "sp_cabangOther", cabangRevealFn: "spOnCabang"
  });
  if(state.revisi) spFillForm(state.revisi.data);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const get = (id) => document.getElementById(id).value.trim();

    const req = [
      ["sp_namaAtasan","Nama Atasan"], ["sp_posisiAtasan","Posisi Atasan"], ["sp_divisiAtasan","Divisi Atasan"],
      ["sp_namaKaryawan","Nama Karyawan"], ["sp_posisiKaryawan","Posisi Karyawan"], ["sp_divisiKaryawan","Divisi Karyawan"],
      ["sp_detail","Detail Pelanggaran"]
    ];
    for(const [id, label] of req){
      if(!get(id)){ alert("Mohon lengkapi: " + label); document.getElementById(id).focus(); return; }
    }
    const cabang = spGetCabang();
    if(!cabang){ alert("Mohon pilih atau isi Cabang."); return; }
    const jenis = spGetJenis();
    if(!jenis){ alert("Mohon pilih Jenis Tindakan."); return; }
    const alasan = spGetAlasan();
    if(alasan.length === 0){ alert("Mohon pilih minimal satu Alasan Pemberian Surat."); return; }

    const data = {
      namaAtasan: get("sp_namaAtasan"), posisiAtasan: get("sp_posisiAtasan"), divisiAtasan: get("sp_divisiAtasan"),
      namaKaryawan: get("sp_namaKaryawan"), posisiKaryawan: get("sp_posisiKaryawan"), divisiKaryawan: get("sp_divisiKaryawan"),
      cabang, jenis, alasan: alasan.join(", "), detail: get("sp_detail")
    };

    const btn = document.getElementById("spSubmitBtn");
    const btnLabel = btn.textContent;
    btn.disabled = true; btn.textContent = "Mengirim...";
    const fail = (msg) => { alert(msg); btn.disabled = false; btn.textContent = btnLabel; };

    // ---- Revisi ----
    if(state.revisi){
      const kode = state.revisi.kode;
      const res = await api("revisiSuratTindakan", { kode, data });
      if(!res || res.error) return fail("Gagal mengirim revisi: " + (res && res.error ? res.error : "coba lagi."));
      state.revisi = null;
      state.submitted = { kode, id: res.id || kode.slice(0, kode.lastIndexOf("-")), nama: data.namaKaryawan, jenis: data.jenis, revisi: true };
      setView("sp-done");
      return;
    }

    // ---- Pengajuan baru ----
    let res = await api("submitSuratTindakan", { data });
    if(res && res.duplicate){
      if(!confirm(res.message + "\n\nKemungkinan pengajuan sudah pernah terkirim. Tetap kirim pengajuan baru?")){
        btn.disabled = false; btn.textContent = btnLabel; return;
      }
      res = await api("submitSuratTindakan", { data, force: true });
    }
    if(!res || res.error) return fail("Gagal mengirim: " + (res && res.error ? res.error : "coba lagi."));

    simpanKodeSaya({ kode: res.kode, nama: data.namaKaryawan, jenis: data.jenis, waktu: res.timestamp || new Date().toISOString() });
    state.submitted = { kode: res.kode, id: res.id, nama: data.namaKaryawan, jenis: data.jenis };
    setView("sp-done");
  });
}

          <div><div class="section-title" style="font-size:15px;">${esc(r.namaKaryawan)}</div>
          <div class="cell-sub">${esc(r.id)} &middot; diajukan ${fmtDateTime(r.timestamp)}${+r.revisiKe ? ` &middot; revisi ke-${esc(r.revisiKe)}` : ""}</div></div>
          ${spStatusBadge(st)}
        </div>

        <div class="sp-kvs">

async function spCek(){

/* ---------- DASHBOARD (HR) ---------- */
// Akhir masa SP: pakai "Berlaku Sampai" dari surat; kalau kosong, tanggal terbit + SP_PERIOD_MONTHS
function spEndDate(e){
  if(e.berlakuSampai){ const x = new Date(String(e.berlakuSampai).slice(0,10) + "T00:00:00"); if(!isNaN(x)) return x; }
  if(!e.tanggalSP) return null;
  const start = new Date(String(e.tanggalSP).slice(0,10) + "T00:00:00");
  return isNaN(start) ? null : spAddMonths(start, SP_PERIOD_MONTHS);
}
function spEntryDate(e){ return (spIsApproved(e) && e.tanggalSP) ? e.tanggalSP : e.timestamp; }
// Masa SP hanya untuk SP yang sudah disetujui; dihitung dari tanggal surat diterbitkan
function spEligState(e){
  if(!SP_TYPES.includes(e.jenis) || !spIsApproved(e) || !e.tanggalSP) return null;
  const exp = spEndDate(e);
  if(!exp) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.ceil((exp - now) / 86400000);
  if(days <= 0) return { key:"eligible", label:"Eligible Kembali", color:"#0f9d6f", days, exp };
  if(days <= SP_SOON_DAYS) return { key:"soon", label:"Akan Berakhir", color:"#e2620d", days, exp };
  return { key:"active", label:"Masa Aktif SP", color:"#d02525", days, exp };
}

function spDonutHtml(segs, centerNum, centerLbl){
  segs = segs.filter(s => s.value > 0);
  const total = segs.reduce((a,s) => a + s.value, 0);
  if(!total) return `<div class="sp-donut-wrap"><div class="sp-empty-mini">Belum ada data yang disetujui.</div></div>`;
  const R = 48, C = 2 * Math.PI * R;
  let off = 0;
  const rings = segs.map(s => {
    const dash = (s.value / total) * C;
    const ring = `<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:${s.color}" stroke-width="18" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += dash;
    return ring;
  }).join("");
  const legend = segs.map(s => {
    const pct = ((s.value/total)*100).toFixed(0);
    return `<span class="sp-dl-item"><i style="background:${s.color}"></i><b>${esc(s.label)}</b><em>${s.value} &middot; ${pct}%</em></span>`;
  }).join("");
  return `
    <div class="sp-donut-wrap">
      <svg viewBox="0 0 120 120" class="sp-donut" role="img">
        <g transform="rotate(-90 60 60)"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#eef4f3" stroke-width="18"/>${rings}</g>
        <text x="60" y="57" class="sp-dn-num">${centerNum}</text><text x="60" y="72" class="sp-dn-lbl">${esc(centerLbl)}</text>
      </svg>
      <div class="sp-donut-legend">${legend}</div>
    </div>
  `;
}

function spGroupBy(data, key){
  const map = {};
  data.forEach(e => {
    const k = String(e[key] || "—").trim() || "—";
    map[k] = map[k] || { total: 0, by: {} };
    map[k].total++;
    map[k].by[e.jenis] = (map[k].by[e.jenis] || 0) + 1;
  });
  return Object.entries(map).map(([name, v]) => ({ name, ...v })).sort((a,b) => b.total - a.total).slice(0, 8);
}

function spBarsHtml(rows){
  if(!rows.length) return `<div class="sp-empty-mini">Belum ada data yang disetujui.</div>`;
  const max = Math.max(...rows.map(r => r.total));
  return rows.map(r => {
    const w = (r.total / max) * 100;
    const segs = SP_JENIS_KEYS.filter(k => r.by[k]).map(k => `<div class="sp-bar-seg" style="width:${(r.by[k]/r.total)*100}%;background:${spSevOf(k).color}"></div>`).join("");
    const other = Object.keys(r.by).filter(k => !SP_JENIS_KEYS.includes(k)).reduce((s,k) => s + r.by[k], 0);
    const otherSeg = other ? `<div class="sp-bar-seg" style="width:${(other/r.total)*100}%;background:${SP_OTHER_COLOR}"></div>` : "";
    return `<div class="sp-bar-row"><div class="sp-bar-name" title="${esc(r.name)}">${esc(r.name)}</div>
      <div class="sp-bar-track"><div class="sp-bar-fill" style="width:${w}%">${segs}${otherSeg}</div></div>
      <div class="sp-bar-val">${r.total}</div></div>`;
  }).join("");
}

function spIneligibleList(data){
  const map = {};
  data.forEach(e => {
    const el = spEligState(e);
    if(el && el.days > 0){
      const k = (e.namaKaryawan||"").trim().toLowerCase();
      if(!map[k] || el.exp > map[k]._exp){
        map[k] = { id:e.id, nama:e.namaKaryawan, cabang:e.cabang, divisi:e.divisiKaryawan, jenis:e.jenis, exp:spFmtDateLong(el.exp), days:el.days, _exp:el.exp };
      }
    }
  });
  return Object.values(map).sort((a,b) => a._exp - b._exp);
}

function spSetFilter(f){ state.spFilter = f; state.pageSP = 1; render(); }

function renderSPDashboard(){
  const all = STORAGE.suratTindakan.slice();
  const approved = all.filter(spIsApproved).sort((a,b) => new Date(spEntryDate(b)) - new Date(spEntryDate(a)));
  const pending = all.filter(e => spStatusOf(e) === ST.PENDING).sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp)));
  const revisi = all.filter(e => spStatusOf(e) === ST.REVISI);
  const total = approved.length;

  /* --- Antrean review --- */
  const queueRows = pending.length
    ? pending.map(e => `
        <div class="sp-queue-item" onclick="spOpenDetail('${esc(e.id)}')">
          <div class="sp-queue-main">
            <div class="font-medium">${esc(e.namaKaryawan)} ${spJenisBadge(e.jenis)}${+e.revisiKe ? ` <span class="sp-tag-rev">revisi ke-${esc(e.revisiKe)}</span>` : ""}</div>
            <div class="cell-sub">${esc(e.cabang||'-')} &middot; diajukan ${esc(e.namaAtasan||'-')} &middot; ${fmtDateTime(e.timestamp)}</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();spOpenDetail('${esc(e.id)}')">Review</button>
        </div>`).join("")
    : `<div class="sp-empty-mini" style="padding:18px 0;">Tidak ada pengajuan yang menunggu review. &#127881;</div>`;

  const queue = `
    <div class="card sp-queue">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
        <div>
          <div class="section-title" style="font-size:14.5px;">Menunggu Persetujuan</div>
          <div class="page-desc" style="margin-top:2px;">Belum dihitung di statistik maupun masa SP sampai disetujui.</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${spStatusBadge(ST.PENDING).replace(ST.PENDING, pending.length + " menunggu")}
          ${revisi.length ? `<span style="cursor:pointer" onclick="spSetFilter('${ST.REVISI}');document.getElementById('spTable').scrollIntoView({behavior:'smooth'})">${spStatusBadge(ST.REVISI).replace(ST.REVISI, revisi.length + " menunggu revisi atasan")}</span>` : ""}
        </div>
      </div>
      <div class="sp-queue-list">${queueRows}</div>
    </div>`;

  /* --- Statistik (hanya yang disetujui) --- */
  const statRow = SP_JENIS_KEYS.map(key => {
    const j = SP_JENIS[key];
    const n = approved.filter(e => e.jenis === key).length;
    const pct = total ? ((n/total)*100).toFixed(0) : 0;
    return `<div class="sp-stat ${j.cls}"><div class="lbl"><span class="d"></span>${esc(j.short)}</div><div class="num">${n}</div><div class="pct">${pct}% dari total</div></div>`;
  }).join("") + `<div class="sp-stat" style="--sev:var(--brand);"><div class="lbl"><span class="d"></span>Total</div><div class="num">${total}</div><div class="pct">Surat disetujui</div></div>`;

  const jenisDonut = spDonutHtml(SP_JENIS_KEYS.map(k => ({ label: SP_JENIS[k].short, value: approved.filter(e=>e.jenis===k).length, color: SP_JENIS[k].color })), total, "Disetujui");

  const spOnly = approved.filter(e => SP_TYPES.includes(e.jenis));
  const bucket = { active:0, soon:0, eligible:0 };
  spOnly.forEach(e => { const el = spEligState(e); if(el) bucket[el.key]++; });
  const masaDonut = spDonutHtml([
    { label:"Masa Aktif SP", value:bucket.active, color:"#d02525" },
    { label:`Akan Berakhir (≤${SP_SOON_DAYS} hari)`, value:bucket.soon, color:"#e2620d" },
    { label:"Eligible Kembali", value:bucket.eligible, color:"#0f9d6f" },
  ], spOnly.length, "Total SP");

  const barCabang = spBarsHtml(spGroupBy(approved, "cabang"));
  const barDivisi = spBarsHtml(spGroupBy(approved, "divisiKaryawan"));

  const colorKey = `<span class="kt">Warna jenis:</span>` + SP_JENIS_KEYS.map(k => `<span class="k"><i style="background:${SP_JENIS[k].color}"></i>${esc(SP_JENIS[k].short)}</span>`).join("") + `<span class="k"><i style="background:${SP_OTHER_COLOR}"></i>Lainnya</span>`;

  const ineligible = spIneligibleList(approved);
  const ineligibleRows = ineligible.length
    ? ineligible.map((r,i) => {
        const soon = r.days <= SP_SOON_DAYS;
        return `<tr class="sp-row-click" onclick="spOpenDetail('${esc(r.id)}')"><td class="cell-muted">${i+1}</td><td class="font-medium">${esc(r.nama)}</td><td>${esc(r.divisi||'-')}</td><td>${esc(r.cabang||'-')}</td>
          <td>${spJenisBadge(r.jenis)}</td>
          <td><b>${esc(r.exp)}</b><div class="cell-sub" style="color:${soon?'#c85410':'var(--muted)'};">sisa ${r.days} hari${soon?' &middot; segera berakhir':''}</div></td></tr>`;
      }).join("")
    : `<tr><td colspan="6"><div class="empty-state">Tidak ada karyawan dalam masa SP saat ini.</div></td></tr>`;

  /* --- Tabel semua pengajuan --- */
  const filters = ["Semua", ST.PENDING, ST.REVISI, ST.APPROVED, ST.REJECTED];
  const cur = state.spFilter || "Semua";
  const countOf = (f) => f === "Semua" ? all.length : all.filter(e => spStatusOf(e) === f).length;
  const tabs = filters.map(f => `<button class="sp-tab ${cur===f?'on':''}" onclick="spSetFilter('${f}')">${esc(f)} <span>${countOf(f)}</span></button>`).join("");
  const listData = all.filter(e => cur === "Semua" || spStatusOf(e) === cur)
    .sort((a,b) => String(b.timestamp).localeCompare(String(a.timestamp)));

  const pg = paginate(listData, state.pageSP);
  const tableRows = pg.rows.length
    ? pg.rows.map((e,i) => {
        const st = spStatusOf(e);
        const el = spEligState(e);
        let masaCell;
        if(el) masaCell = `<span class="badge" style="background:${el.color}22;color:${el.color};border-color:${el.color}55;">${esc(el.label)}</span><div class="cell-sub">${el.days>0 ? 'sisa '+el.days+' hari' : 'berakhir '+(-el.days)+' hari lalu'}</div>`;
        else if(st !== ST.APPROVED && SP_TYPES.includes(e.jenis)) masaCell = `<span class="cell-muted">Belum berjalan</span>`;
        else if(e.jenis === "Surat PHK") masaCell = `<span class="cell-muted">&mdash; (PHK)</span>`;
        else masaCell = `<span class="cell-muted">Tidak ada masa SP</span>`;
        return `<tr class="sp-row-click" onclick="spOpenDetail('${esc(e.id)}')">
          <td class="cell-muted">${pg.start+i+1}</td>
          <td class="font-medium">${esc(e.namaKaryawan)}<div class="cell-sub">${esc(e.posisiKaryawan||'-')} &middot; ${esc(e.divisiKaryawan||'-')}</div></td>
          <td>${spJenisBadge(e.jenis)}</td>
          <td>${esc(e.cabang||'-')}</td>
          <td>${fmtDate(e.timestamp)}${st===ST.APPROVED && e.tanggalSP ? `<div class="cell-sub">terbit ${fmtDate(e.tanggalSP)}</div>` : ""}</td>
          <td>${spStatusBadge(st)}</td>
          <td>${masaCell}</td>
          <td style="text-align:center;">${spLink(e) ? `<a class="icon-btn" href="${esc(spLink(e))}" target="_blank" rel="noopener" title="Buka surat" onclick="event.stopPropagation()">${ic.file}</a>` : `<span class="cell-muted">&ndash;</span>`}</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="8"><div class="empty-state">Tidak ada pengajuan${cur !== "Semua" ? ` berstatus "${esc(cur)}"` : ""}.</div></td></tr>`;

  return `
    ${queue}

    <div class="sp-section-label">Statistik surat yang sudah disetujui</div>
    <div class="sp-stat-row">${statRow}</div>

    <div class="sp-panels">
      <div class="sp-panel"><h3>Komposisi Jenis Tindakan</h3><div class="ph">Proporsi SP &amp; Surat Teguran yang disetujui</div>${jenisDonut}</div>
      <div class="sp-panel"><h3>Status Masa SP</h3><div class="ph">Berdasarkan tanggal berlaku sampai di tiap surat</div>${masaDonut}</div>
      <div class="sp-panel"><h3>Berdasarkan Cabang</h3><div class="ph">Cabang dengan tindakan terbanyak</div><div class="sp-bars">${barCabang}</div></div>
      <div class="sp-panel"><h3>Berdasarkan Divisi</h3><div class="ph">Divisi dengan tindakan terbanyak</div><div class="sp-bars">${barDivisi}</div></div>
    </div>

    <div class="sp-colorkey">${colorKey}</div>

    <div class="card" style="padding:20px;margin-bottom:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
        <div>
          <div class="section-title" style="font-size:14.5px;">Karyawan dalam Masa SP</div>
          <div class="page-desc" style="margin-top:2px;">Belum eligible untuk kenaikan gaji, pengajuan loan, dll. selama masa SP berjalan.</div>
        </div>
        <span class="badge ${ineligible.length ? 'badge-danger' : 'badge-ok'}"><span class="badge-dot"></span>${ineligible.length} karyawan</span>
      </div>
      <div style="overflow-x:auto;border:1px solid var(--line);border-radius:12px;">
        <table><thead><tr><th style="width:36px;">No</th><th>Nama</th><th>Divisi</th><th>Cabang</th><th>SP Terakhir</th><th>Eligible Kembali</th></tr></thead>
        <tbody>${ineligibleRows}</tbody></table>
      </div>
    </div>

    <div class="card" id="spTable">
      <div class="sp-tabs">${tabs}</div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th style="width:36px;">No</th><th>Karyawan</th><th>Jenis</th><th>Cabang</th><th>Diajukan</th><th>Status</th><th>Masa Berlaku SP</th><th style="width:60px;text-align:center;">Surat</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      ${renderPagination('sp', pg, state.pageSP, 'goPageSP')}
    </div>
  `;
}
function goPageSP(p){ state.pageSP = p; render(); }

/* ---------- DETAIL & REVIEW (HR) ---------- */
function spFind(id){ return STORAGE.suratTindakan.find(e => e.id === id); }
function spOpenDetail(id){ state.modalId = id; spRenderModal(); }
function spCloseModal(){ state.modalId = null; document.getElementById("modalRoot").innerHTML = ""; document.body.style.overflow = ""; document.body.classList.remove("sp-modal-open"); }
document.addEventListener("keydown", (e) => { if(e.key === "Escape" && state.modalId) spCloseModal(); });

function spPesanAtasan(e){
  const st = spStatusOf(e);
  const kode = e.kode ? `${e.id}-${e.kode}` : "";
  const sapa = `Halo ${e.namaAtasan || ""}, pengajuan ${e.jenis} untuk ${e.namaKaryawan} (${e.id})`;
  const cara = kode ? `\n\nCek di halaman Surat Peringatan & Teguran > menu "Cek Status & Revisi", masukkan kode: ${kode}` : "";
  if(st === ST.REVISI) return `${sapa} perlu direvisi:\n${e.catatanHR || "-"}${cara}`;
  if(st === ST.APPROVED) return `${sapa} sudah disetujui. Surat diterbitkan tanggal ${spFmtDateLong(e.tanggalSP)}${e.nomorSurat ? " (No. " + e.nomorSurat + ")" : ""}.${cara}`;
  if(st === ST.REJECTED) return `${sapa} tidak disetujui.\nAlasan: ${e.catatanHR || "-"}${cara}`;
  return `${sapa} sedang direview HR.${cara}`;
}

function spRiwayatHtml(text){
  const lines = String(text || "").split("\n").map(s => s.trim()).filter(Boolean);
  if(!lines.length) return "";
  return `<div class="sp-md-section"><div class="sp-md-label">Riwayat</div><div class="sp-timeline">
    ${lines.map(l => { const p = l.split(" | "); return `<div class="sp-tl-item"><div class="sp-tl-dot"></div><div><div class="sp-tl-what">${esc(p[2] || "")}${p[3] ? `<span class="cell-muted"> &mdash; ${esc(p.slice(3).join(" | "))}</span>` : ""}</div><div class="cell-sub">${esc(p[0] || "")} &middot; ${esc(p[1] || "")}</div></div></div>`; }).join("")}
  </div></div>`;
}

function spRenderModal(){
  const e = spFind(state.modalId);
  const root = document.getElementById("modalRoot");
  if(!e){ spCloseModal(); return; }
  const st = spStatusOf(e);
  const isSP = SP_TYPES.includes(e.jenis);
  const el = spEligState(e);
  const kodeFull = e.kode ? `${e.id}-${e.kode}` : "";

  const approvedBox = st === ST.APPROVED ? `
    <div class="sp-md-grid" style="margin-top:14px;">
      <div><div class="sp-md-label">Tanggal surat terbit</div><div class="font-medium">${esc(spFmtDateLong(e.tanggalSP))}</div></div>
      <div><div class="sp-md-label">${isSP ? "Berlaku sampai" : "Masa SP"}</div><div class="font-medium">${el ? esc(spFmtDateLong(el.exp)) + `<div class="cell-sub">${el.days>0 ? 'sisa '+el.days+' hari' : 'sudah berakhir'}</div>` : "Tidak ada"}</div></div>
      ${e.nomorSurat ? `<div><div class="sp-md-label">Nomor surat</div><div class="font-medium">${esc(e.nomorSurat)}</div></div>` : ""}
    </div>` : "";

  let actions = "";
  if(st === ST.PENDING || st === ST.REVISI){
    const defEnd = spIsoDate(spAddMonths(new Date(todayStr()+"T00:00:00"), SP_PERIOD_MONTHS));
    const endField = isSP ? `<div><label class="field-label">Berlaku sampai</label><input type="date" id="apv_berlaku" value="${defEnd}" oninput="this.dataset.manual='1'"></div>` : "";
    const expHint = isSP ? `Default ${SP_PERIOD_MONTHS} bulan dari tanggal terbit. Ubah kalau surat menetapkan tanggal lain.` : "Jenis ini tidak memiliki masa SP.";
    actions = `
      <div class="sp-md-actions">
        <div class="sp-md-label">Keputusan HR</div>
        ${st === ST.REVISI ? `<div class="field-hint" style="margin:0 0 10px;">Pengajuan sedang menunggu revisi dari atasan. Kamu tetap bisa langsung memutuskan.</div>` : ""}
        <div class="sp-decide">
          <button type="button" class="sp-decide-btn ok" onclick="spPickAction('approve')" data-act="approve">Setujui</button>
          <button type="button" class="sp-decide-btn rev" onclick="spPickAction('revise')" data-act="revise">Minta Revisi</button>
          <button type="button" class="sp-decide-btn no" onclick="spPickAction('reject')" data-act="reject">Tolak</button>
        </div>

        <div class="sp-act-box" id="act_approve">
          <div class="sp-grid-2">
            <div><label class="field-label">Tanggal surat diterbitkan</label><input type="date" id="apv_tanggal" value="${todayStr()}" oninput="spApvDate()"></div>
            ${endField}
            <div><label class="field-label">Nomor surat <span class="field-hint">(opsional)</span></label><input type="text" id="apv_nomor" placeholder="mis. 08.035/WMC/SP/X/2026"></div>
            <div><label class="field-label">Link surat di Drive <span class="field-hint">(opsional)</span></label><input type="text" id="apv_link" placeholder="https://drive.google.com/..."></div>
          </div>
          <div class="field-hint" style="margin-top:8px;">${expHint}</div>
          <label class="field-label" style="margin-top:12px;">Catatan <span class="field-hint">(opsional)</span></label>
          <textarea id="apv_catatan" rows="2" placeholder="Catatan internal HR"></textarea>
          <div class="sp-act-foot"><button class="btn btn-primary" id="btn_approve" onclick="spSubmitReview('approve')">Setujui &amp; terbitkan</button></div>
        </div>

        <div class="sp-act-box" id="act_revise">
          <label class="field-label">Apa yang perlu direvisi atasan?</label>
          <textarea id="rev_catatan" rows="3" placeholder="mis. Kronologi belum mencantumkan tanggal kejadian; lampirkan bukti absensi."></textarea>
          <div class="field-hint" style="margin-top:6px;">Setelah dikirim, salin pesan untuk atasan (berisi kode pengajuan) dan kirim lewat WhatsApp.</div>
          <div class="sp-act-foot"><button class="btn btn-primary" id="btn_revise" onclick="spSubmitReview('revise')">Kembalikan ke atasan</button></div>
        </div>

        <div class="sp-act-box" id="act_reject">
          <label class="field-label">Alasan penolakan</label>
          <textarea id="rej_catatan" rows="3" placeholder="mis. Pengajuan dobel dengan SP-3."></textarea>
          <div class="sp-act-foot"><button class="btn btn-danger" id="btn_reject" onclick="spSubmitReview('reject')">Tolak pengajuan</button></div>
        </div>
      </div>`;
  } else {
    actions = `
      <div class="sp-md-actions">
        <div class="field-hint" style="margin:0 0 10px;">Diputuskan oleh ${esc(e.reviewedBy || "-")} &middot; ${fmtDateTime(e.reviewedAt)}</div>
        <button type="button" class="btn btn-outline btn-sm" onclick="spReopen()">Buka kembali (kembalikan ke Menunggu Review)</button>
      </div>`;
  }

  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) spCloseModal()">
      <div class="card sp-modal" role="dialog" aria-modal="true">
        <div class="sp-md-head">
          <div>
            <div class="cell-sub">${esc(e.id)} &middot; diajukan ${fmtDateTime(e.timestamp)}${+e.revisiKe ? ` &middot; revisi ke-${esc(e.revisiKe)}` : ""}</div>
            <h2 style="font-size:17px;margin:4px 0 8px;">${esc(e.namaKaryawan)}</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${spStatusBadge(st)} ${spJenisBadge(e.jenis)}
              ${spLink(e) ? `<a class="btn btn-primary btn-sm" href="${esc(spLink(e))}" target="_blank" rel="noopener">${ic.extlink} Buka Surat</a>` : ""}</div>
          </div>
          <button class="icon-btn" onclick="spCloseModal()" aria-label="Tutup">${ic.close}</button>
        </div>

        <div class="sp-md-body">
          <div class="sp-md-grid">
            <div><div class="sp-md-label">Karyawan</div><div class="font-medium">${esc(e.posisiKaryawan||'-')}</div><div class="cell-sub">${esc(e.divisiKaryawan||'-')} &middot; ${esc(e.cabang||'-')}</div></div>
            <div><div class="sp-md-label">Diajukan oleh</div><div class="font-medium">${esc(e.namaAtasan||'-')}</div><div class="cell-sub">${esc(e.posisiAtasan||'-')} &middot; ${esc(e.divisiAtasan||'-')}</div></div>
          </div>
          ${approvedBox}
          <div class="sp-md-section"><div class="sp-md-label">Alasan</div><div>${esc(e.alasan||'-')}</div></div>
          <div class="sp-md-section"><div class="sp-md-label">Detail pelanggaran / kronologi</div><div class="sp-md-detail">${esc(e.detail||'-')}</div></div>
          ${e.catatanHR ? `<div class="sp-note ${st===ST.REVISI?'sp-note-revisi':''}" style="margin-top:14px;"><div class="sp-note-label">Catatan HR</div><div class="sp-note-body">${esc(e.catatanHR)}</div></div>` : ""}

          <div class="sp-md-section sp-md-kode">
            <div>
              <div class="sp-md-label">Kode pengajuan (untuk atasan)</div>
              <div class="font-medium" style="letter-spacing:.04em;">${kodeFull ? esc(kodeFull) : '<span class="cell-muted">Dibuat otomatis saat review</span>'}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${kodeFull ? `<button class="btn btn-outline btn-sm" onclick="copyText('${esc(kodeFull)}', this)">Salin kode</button>` : ""}
              <button class="btn btn-outline btn-sm" onclick="copyText(spPesanAtasan(spFind('${esc(e.id)}')), this)">Salin pesan untuk atasan</button>
            </div>
          </div>

          ${st === ST.APPROVED ? `
          <div class="sp-md-section sp-md-kode">
            <div style="min-width:0;">
              <div class="sp-md-label">File surat</div>
              ${spLink(e) ? `<a href="${esc(spLink(e))}" target="_blank" rel="noopener" class="sp-link-text">${esc(spLink(e))}</a>` : `<span class="cell-muted">Belum ada link surat</span>`}
            </div>
            <button class="btn btn-outline btn-sm" id="btn_link" onclick="spEditLink()">${spLink(e) ? "Ubah link" : "Tambah link surat"}</button>
          </div>` : ""}

          ${spRiwayatHtml(e.riwayat)}
        </div>
        ${actions}
      </div>
    </div>`;
  document.body.style.overflow = "hidden";
  document.body.classList.add("sp-modal-open");
}

function spPickAction(mode){
  document.querySelectorAll(".sp-act-box").forEach(b => b.classList.toggle("show", b.id === "act_" + mode));
  document.querySelectorAll(".sp-decide-btn").forEach(b => b.classList.toggle("on", b.dataset.act === mode));
  const f = { revise:"rev_catatan", reject:"rej_catatan" }[mode];
  const el = f && document.getElementById(f);
  if(el) el.focus();
}
function spIsoDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function spApvDate(){
  const v = document.getElementById("apv_tanggal").value;
  const end = document.getElementById("apv_berlaku");
  if(end && v && !end.dataset.manual) end.value = spIsoDate(spAddMonths(new Date(v + "T00:00:00"), SP_PERIOD_MONTHS));
}

async function spSubmitReview(decision, extra){
  const e = spFind(state.modalId);
  if(!e) return;
  const payload = { id: e.id, decision, idToken: state.googleIdToken };
  if(decision === "approve"){
    payload.tanggalSP = document.getElementById("apv_tanggal").value;
    payload.nomorSurat = document.getElementById("apv_nomor").value.trim();
    payload.linkSurat = document.getElementById("apv_link").value.trim();
    if(payload.linkSurat && !/^https:\/\//i.test(payload.linkSurat)){ alert("Link surat harus diawali https:// (salin dari tombol Share / Bagikan di Google Drive)."); return; }
    payload.catatan = document.getElementById("apv_catatan").value.trim();
    if(!payload.tanggalSP){ alert("Isi tanggal surat diterbitkan."); return; }
    const end = document.getElementById("apv_berlaku");
    if(end){
      payload.berlakuSampai = end.value;
      if(!payload.berlakuSampai){ alert("Isi tanggal berlaku sampai."); return; }
      if(payload.berlakuSampai < payload.tanggalSP){ alert("Tanggal berlaku sampai tidak boleh sebelum tanggal surat diterbitkan."); return; }
    }
  } else if(decision === "revise"){
    payload.catatan = document.getElementById("rev_catatan").value.trim();
    if(!payload.catatan){ alert("Tulis apa yang perlu direvisi atasan."); return; }
  } else if(decision === "reject"){
    payload.catatan = document.getElementById("rej_catatan").value.trim();
    if(!payload.catatan){ alert("Tulis alasan penolakan."); return; }
  } else if(decision === "reopen"){
    payload.catatan = (extra && extra.catatan) || "";
  }

  const btn = document.getElementById("btn_" + decision);
  const label = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.textContent = "Menyimpan..."; }

  const res = await api("reviewSuratTindakan", payload);
  if(!res || res.error){
    if(btn){ btn.disabled = false; btn.innerHTML = label; }
    if(res && res.error) alert("Gagal menyimpan: " + res.error);
    return;
  }
  if(res.pengajuan){
    const i = STORAGE.suratTindakan.findIndex(x => x.id === e.id);
    if(i >= 0) STORAGE.suratTindakan[i] = res.pengajuan;
  }
  render();
  spRenderModal();
}
async function spEditLink(){
  const e = spFind(state.modalId);
  if(!e) return;
  const v = prompt("Tempel link file surat dari Google Drive (kosongkan untuk menghapus link):", e.linkSurat || "");
  if(v === null) return;
  const link = v.trim();
  if(link && !/^https:\/\//i.test(link)){ alert("Link surat harus diawali https://"); return; }
  const btn = document.getElementById("btn_link");
  if(btn){ btn.disabled = true; btn.textContent = "Menyimpan..."; }
  const res = await api("setLinkSurat", { id: e.id, linkSurat: link, idToken: state.googleIdToken });
  if(!res || res.error){
    if(btn){ btn.disabled = false; btn.textContent = "Ubah link"; }
    if(res && res.error) alert("Gagal menyimpan: " + res.error);
    return;
  }
  if(res.pengajuan){
    const i = STORAGE.suratTindakan.findIndex(x => x.id === e.id);
    if(i >= 0) STORAGE.suratTindakan[i] = res.pengajuan;
  }
  render();
  spRenderModal();
}
function spReopen(){
  const note = prompt("Kembalikan pengajuan ini ke \"Menunggu Review\"?\nPersetujuan/penolakan sebelumnya dibatalkan dan masa SP tidak dihitung lagi.\n\nAlasan (opsional):", "");
  if(note === null) return;
  spSubmitReview("reopen", { catatan: note.trim() });
}

function render(){
  const app = document.getElementById("app");

  // Belum memilih peran -> tampilkan layar pilihan penuh, sidebar & topbar
  // disembunyikan supaya tidak ada jalan pintas yang membingungkan.
  if(!state.role){
    document.body.classList.add("role-gate");
    app.innerHTML = renderRoleGate();
    return;
  }
  document.body.classList.remove("role-gate");

  renderSidebarNav();
  renderTopbar();
  let html = "";
  if(!SHEETS_API_URL){
    html += `<div class="banner banner-warn">${ic.file} Dashboard belum tersambung ke Google Sheets &mdash; saat ini memakai data dummy lokal. Tempel URL Web App Apps Script di variabel <code>SHEETS_API_URL</code> pada kode untuk mengaktifkan sinkronisasi.</div>`;
  }

  let needsGoogleButton = false;

  if(state.role === "hr"){
    if(!state.hrAuthorized){
      html += renderLoginGate("Dashboard Surat Peringatan &amp; Teguran khusus HR. Masuk dengan akun Google yang terdaftar untuk melanjutkan.");
      needsGoogleButton = true;
    } else {
      if(state.loadError){
        html += `<div class="banner banner-warn">${ic.alert} Data gagal dimuat dari Google Sheets: ${esc(state.loadError)} &mdash; <a href="javascript:void(0)" onclick="manualSync()">coba lagi</a></div>`;
      }
      html += renderSPDashboard();
    }
  } else if(state.view === "sp-status"){
    html += renderSPStatus();
  } else if(state.view === "sp-done"){
    html += renderSPDone();
  } else {
    html += renderSPForm();
  }

  app.innerHTML = html;
  if(needsGoogleButton){
    renderGoogleButton();
  }
  if(state.role === "atasan" && document.getElementById("spForm")){
    attachSPFormHandlers();
  }
}

// Ambil daftar karyawan terbaru dari sheet "Master Karyawan".
// Kalau gagal, tetap pakai daftar cadangan EMPLOYEES di atas.
async function loadEmployees(){
  if(!SHEETS_API_URL) return;
  try{
    const res = await fetch(`${SHEETS_API_URL}?action=karyawan&_ts=${Date.now()}`, {cache:'no-store'});
    const data = await res.json();
    if(data && Array.isArray(data.karyawan) && data.karyawan.length){
      EMPLOYEES = data.karyawan.filter(e => e && e.n);
    }
  }catch(err){
    console.warn("Daftar karyawan dari Sheets gagal dimuat, pakai daftar cadangan.", err);
  }
}

(async function init(){
  render();
  loadEmployees();
})();
