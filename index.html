<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRGA & Legal Portal — WM Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D;
    --navy-2:#1E3358;
    --navy-soft:#EEF2F9;
    --orange:#E2661D;
    --orange-2:#9A3E12;
    --orange-soft:#FDEAD9;
    --cream:#FBF4ED;
    --cream-border:#E7DDD1;
    --ink:#1B2333;
    --muted:#767C8E;
    --border:#E7E9F1;
    --white:#FFFFFF;
    --radius:18px;
    --shadow: 0 1px 2px rgba(20,33,61,.04), 0 8px 20px rgba(20,33,61,.05);
    --shadow-hover: 0 16px 36px rgba(20,33,61,.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .page{max-width:1080px; margin:0 auto;}

  /* ---------- MINI STICKY HEADER ---------- */
  .mini-header{
    position:fixed; top:0; left:0; right:0;
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:12px 24px;
    display:flex; align-items:center; gap:10px;
    transform:translateY(-100%);
    transition:transform .25s ease, box-shadow .25s ease;
    z-index:500;
  }
  .mini-header.show{
    transform:translateY(0);
    box-shadow:0 4px 16px rgba(20,33,61,.08);
  }
  .mini-header .mini-logo{
    width:26px; height:26px; border-radius:8px;
    overflow:hidden; flex-shrink:0;
  }
  .mini-header .mini-logo img{width:100%; height:100%; object-fit:cover; display:block;}
  .mini-header span{font-weight:700; font-size:14px; color:var(--navy);}

  /* ---------- HERO ---------- */
  .hero{
    text-align:center;
    padding:52px 24px 30px;
    background-image: radial-gradient(rgba(20,33,61,.07) 1px, transparent 1px);
    background-size: 16px 16px;
    background-position: center top;
    background-repeat: repeat;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
  }

  .logo-badge{
    width:56px; height:56px;
    margin:0 auto 20px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 22px rgba(20,33,61,.28);
  }
  .logo-badge img{width:100%; height:100%; object-fit:cover; display:block;}

  .hero h1{
    margin:0 0 8px;
    font-size:clamp(22px, 4.2vw, 32px);
    font-weight:800;
    color:var(--navy);
    letter-spacing:-0.02em;
  }

  .hero p.subtitle{
    margin:0;
    font-style:italic;
    font-weight:500;
    color:var(--muted);
    font-size:15px;
  }

  /* ---------- FILTER BAR ---------- */
  .filter-bar{padding:6px 24px 4px;}
  .search-wrap{position:relative; margin-bottom:14px;}
  .search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted);}
  .search-wrap input{
    width:100%;
    padding:11px 16px 11px 42px;
    border:1px solid var(--border);
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
    background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-wrap input::placeholder{color:var(--muted);}
  .search-wrap input:focus{border-color:var(--orange); box-shadow:0 0 0 3px rgba(226,102,29,.14);}

  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:inherit;
    font-size:12.5px; font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff; color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active{background:var(--orange); color:#fff; border-color:var(--orange);}
  .chip:hover:not(.active){border-color:var(--navy); color:var(--navy);}

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    padding:16px 24px 20px;
  }

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2, 1fr); padding:14px 20px 20px;}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr; padding:10px 16px 16px; gap:12px;}
    .filter-bar{padding:6px 16px 4px;}
  }

  .empty-state{
    display:none;
    grid-column:1/-1;
    text-align:center;
    padding:44px 20px;
    color:rgba(20,33,61,.75);
    font-size:14px;
    font-weight:500;
  }

  /* ---------- CARD ---------- */
  .card{
    position:relative;
    display:block;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    box-shadow:var(--shadow);
    outline:none;
  }
  .card:hover, .card.open, .card:focus-visible{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(226,102,29,.35);
    z-index:30;
  }
  .card:focus-visible{outline:2px solid var(--navy); outline-offset:3px;}

  .card.coming{opacity:.72;}

  .badge{
    position:absolute; top:14px; right:14px;
    font-size:10px; font-weight:700; letter-spacing:.3px;
    padding:4px 9px; border-radius:999px;
    background:var(--navy-soft); color:var(--muted);
  }

  .icon-badge{
    width:38px; height:38px;
    border-radius:11px;
    background:var(--navy-soft);
    color:var(--navy);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
    transition:transform .18s ease, background .18s ease, color .18s ease;
  }
  .card:hover .icon-badge, .card.open .icon-badge, .card:focus-visible .icon-badge{
    transform:scale(1.1) rotate(-3deg);
    background:var(--orange);
    color:#fff;
  }
  .card.coming .icon-badge{background:#F1F2F5; color:#B0B4BE;}
  .emoji{font-size:19px; line-height:1;}

  .title{font-weight:700; font-size:15px; color:var(--ink); line-height:1.35; padding-right:36px;}

  /* ---------- POPOVER (hover / tap reveal) ---------- */
  .popover{
    position:absolute;
    left:0; right:0; top:calc(100% + 8px);
    background:var(--navy);
    color:#fff;
    border-radius:14px;
    padding:15px 17px 16px;
    font-size:13px;
    line-height:1.55;
    text-align:center;
    box-shadow:0 18px 40px rgba(20,33,61,.35);
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
    z-index:40;
    pointer-events:none;
  }
  .card:hover .popover,
  .card.open .popover,
  .card:focus-visible .popover{
    opacity:1; visibility:visible; transform:translateY(0);
    pointer-events:auto;
  }
  .popover::before{
    content:"";
    position:absolute; top:-6px; left:22px;
    width:12px; height:12px;
    background:var(--navy);
    transform:rotate(45deg);
    border-radius:2px;
  }
  .popover .desc-text{margin:0; opacity:.95;}

  /* ---------- FOOTER ---------- */
  .footer{
    text-align:center;
    padding:30px 24px 40px;
    border-top:1px solid rgba(20,33,61,.15);
    margin-top:16px;
  }
  .footer-label{display:block; font-size:12.5px; color:rgba(20,33,61,.7); margin-bottom:12px; font-weight:500;}
  .footer-links{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .footer-links a{
    display:inline-flex; align-items:center; gap:7px;
    font-size:13px; font-weight:600; color:var(--navy);
    text-decoration:none;
    background:#fff;
    padding:8px 15px;
    border:1px solid transparent;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:all .15s ease;
  }
  .footer-links a:hover{background:var(--navy); color:#fff;}
  .footer-copy{font-size:12px; color:rgba(20,33,61,.65); margin:0;}
</style>
</head>
<body>

<div class="mini-header" id="miniHeader">
  <div class="mini-logo"><img src="wm-logo.jpg" alt="WM Center"></div>
  <span>HRGA &amp; Legal Portal</span>
</div>

<div class="page">
  <header class="hero" id="hero">
    <div class="logo-badge"><img src="wm-logo.jpg" alt="WM Center"></div>
    <h1>HRGA &amp; Legal Portal</h1>
    <p class="subtitle">Access all what you need in here!</p>
  </header>

  <div class="filter-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Cari nama program...">
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-cat="all">Semua</button>
      <button class="chip" data-cat="ta">Talent Acquisition</button>
      <button class="chip" data-cat="pd">People Development</button>
      <button class="chip" data-cat="ga">General Affairs</button>
      <button class="chip" data-cat="legal">Legal &amp; Compliance</button>
      <button class="chip" data-cat="eb">Employer Branding</button>
      <button class="chip" data-cat="ops">HR Operations</button>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <footer class="footer">
    <span class="footer-label">Have a question? Please contact HR!</span>
    <div class="footer-links">
      <a href="https://wa.me/6285217997561" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        HR: +62 852-1799-7561
      </a>
    </div>
    <p class="footer-copy">© WM Center — HR, GA &amp; Legal</p>
  </footer>
</div>

<script>
  // Urutan array ini SUDAH row-major (baris demi baris, kiri ke kanan)
  // supaya di desktop rapi 3 kolom sesuai kolom/baris yang diminta,
  // dan di mobile (1 kolom) otomatis 3 form paling sering diakses tetap muncul duluan.
  // cat: ta = Talent Acquisition, pd = People Development, ga = General Affairs, legal = Legal & Compliance
  // (kategori masih placeholder, nunggu final dari HR)
  const programs = [
    // ROW 1
    { cat:'ta', title:'Manpower Request', file:'manpower.html',
      icon:'👥',
      desc:'Ada kebutuhan manpower di tim kamu? Klik di sini buat submit Manpower Request-mu, WMpeeps!' },
    { cat:'pd', title:'WeGrow', file:'wegrow.html',
      icon:'🌱',
      desc:'Grow your seeds, grow yourself! Ikutan WeGrow dan kumpulkan seeds dari aktivitas self-development kamu!' },
    { cat:'ga', title:'Form Permintaan & Perbaikan Barang', file:'requestga.html',
      icon:'📦',
      desc:'Butuh barang baru atau ada yang perlu diperbaiki? Klik di sini buat submit request-mu ke tim GA WM Center!' },

    // ROW 2
    { cat:'ta', title:'Onboarding Check', file:'onboarding.html',
      icon:'🚀',
      desc:'Welcome, new WMpeeps! Semua onboarding kamu ada di sini: isi form, kasih feedback recruitment experience, dan meet the team~' },
    { cat:'pd', title:'Training & IDP Request', file:'idp.html',
      icon:'📚',
      desc:'Development plan buat staff kamu dimulai dari sini. Isi Training & IDP Request kalau ada kebutuhan training atau IDP di tim.' },
    { cat:'legal', title:'Interdisciplinary Tracker', file:'sp.html',
      icon:'📋',
      desc:'Form untuk pencatatan Surat Peringatan & Surat Teguran, pastikan semua terdokumentasi rapi di sini.' },

    // ROW 3
    { cat:'ta', title:'Employee Referral', file:'referral.html',
      icon:'🤝',
      desc:'The best people knew the best people! Refer kenalanmu sekarang untuk join di WM Center' },
    { cat:'pd', title:'WeImprove', file:'coaching.html',
      icon:'📈',
      desc:'Bantu tim kamu jadi lebih baik lewat coaching yang terarah. Submit WeImprove untuk mulai performance improvement plan!' },
    { cat:'legal', title:'Whistleblowing System', file:'wbs.html',
      icon:'🔒',
      desc:'Speak up! Whistleblowing System ini tempat kamu submit laporan internal secara confidential.' },

    // ROW 4
    { cat:'eb', title:'WMPeeps Club', file:'peepsclub.html',
      icon:'🎉',
      desc:'Kegiatan udah jalan, sekarang giliran lapor! Isi submission WMPeeps Club biar acara kamu tercatat rapi' },
    { cat:'pd', title:'WeCheck', file:'wecheck.html',
      icon:'💬',
      desc:'Ada yang mau diomongin soal kerjaan kamu? Booking 1-on-1 session bareng HR lewat WeCheck, tempat aman buat cerita & kasih feedback!' },
    { cat:'ops', title:'Employee Refinancing', file:'loan.html',
      icon:'💸',
      desc:'Ada kebutuhan mendesak dan butuh bantuan dana? Ajukan Employee Refinancing di sini, prosesnya mudah dan pastinya membantu!' },

    // ROW 5
    { cat:'ops', title:'WM Physio Benefit', file:'physiobene.html',
      icon:'💆',
      desc:'Yuk manfaatin benefit free fisioterapi kamu! Di sini juga ada kode referal unik buat kamu bagikan ke temen, dan mereka bakal dapet potongan kalau pakai kode kamu.' },
    { cat:'eb', title:'WeChoice', file:'wechoice.html',
      icon:'🏆',
      desc:'Waktunya kasih spotlight buat rekan terbaik kita! Submit nominasi WeChoice di sini!' },
  ];

  const grid = document.getElementById('grid');

  programs.forEach((p) => {
    const card = document.createElement(p.comingSoon ? 'div' : 'a');
    card.className = 'card' + (p.comingSoon ? ' coming' : '');
    card.tabIndex = 0;
    card.dataset.cat = p.cat;
    card.dataset.title = p.title.toLowerCase();
    if (!p.comingSoon) {
      card.href = p.file;
      card.target = '_blank';
      card.rel = 'noopener';
    }

    const badge = p.comingSoon ? '<span class="badge">Segera Hadir</span>' : '';

    const popoverHtml = p.desc
      ? `<div class="popover"><p class="desc-text">${p.desc}</p></div>`
      : '';

    card.innerHTML = `
      ${badge}
      <div class="icon-badge"><span class="emoji">${p.icon}</span></div>
      <div class="title">${p.title}</div>
      ${popoverHtml}
    `;

    grid.appendChild(card);
  });

  // ---------- FILTER: search + kategori ----------
  const searchInput = document.getElementById('searchInput');
  const chips = document.querySelectorAll('.chip');
  const cards = document.querySelectorAll('.card');
  let activeCat = 'all';

  let emptyState = document.createElement('div');
  emptyState.className = 'empty-state';
  emptyState.textContent = 'Tidak ada program yang cocok dengan pencarian kamu.';
  grid.appendChild(emptyState);

  function applyFilter(){
    const q = searchInput.value.trim().toLowerCase();
    let visibleCount = 0;
    cards.forEach((c) => {
      const matchCat = activeCat === 'all' || c.dataset.cat === activeCat;
      const matchSearch = c.dataset.title.includes(q);
      const show = matchCat && matchSearch;
      c.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });
    emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
  }

  chips.forEach((chip) => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      applyFilter();
    });
  });

  searchInput.addEventListener('input', applyFilter);

  // ---------- STICKY MINI HEADER ----------
  const miniHeader = document.getElementById('miniHeader');
  const heroEl = document.getElementById('hero');
  window.addEventListener('scroll', () => {
    const threshold = heroEl.offsetHeight - 40;
    if (window.scrollY > threshold) miniHeader.classList.add('show');
    else miniHeader.classList.remove('show');
  });
</script>

</body>
</html>
