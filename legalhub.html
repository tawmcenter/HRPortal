<style>

.lm{width:40px;height:40px;border-radius:10px;background:#0F7B6C;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}

.mn{flex:1;min-width:0;display:flex;flex-direction:column}#v{flex:1}

.lb{font-size:13px;font-weight:700;margin:0 0 6px;display:block}

.ch{display:inline-flex;gap:8px;align-items:center;border:1px solid #CBD5D4;border-radius:10px;padding:0 18px;font-weight:700;margin:0 8px 8px 0;min-height:44px;cursor:pointer}
.bt{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:#0F7B6C;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.b2{background:#fff;color:#0F7B6C;border:1px solid #0F7B6C}.bw{background:#128C4B}.bt:disabled{opacity:.45;cursor:not-allowed}
.vh{position:absolute;opacity:0;width:1px;height:1px}
:focus-visible,label:focus-within{outline:3px solid #12332E;outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;color:#5B6B6A;font-weight:700;padding:12px;border-bottom:1px solid #E3E8E8}
td{padding:12px;border-bottom:1px solid #EEF2F2;vertical-align:top}
.bd{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none}
.sb{background:#E5E7EB;color:#374151}.sr{background:#DBEAFE;color:#1E40AF}.sw{background:#FEF0C7;color:#93370D}.sm{background:#EDE9FE;color:#5B21B6}.sg{background:#D1FAE5;color:#065F46}
.uh{background:#FEE4E2;color:#B42318}.um{background:#FEF0C7;color:#93370D}.ul{background:#D1FAE5;color:#065F46}
.tb{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}.tb button{border:1px solid #CBD5D4;background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}.tb .on{background:#12332E;color:#fff;border-color:#12332E}
.dr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.dr .in{min-height:38px;width:150px}.dr .bt{min-height:38px;padding:0 12px;font-size:13px}
a{color:#0F7B6C;font-weight:600}summary{cursor:pointer;font-weight:600}
.ft{padding:18px 40px;background:#fff;border-top:1px solid #E3E8E8;font-size:13px;color:#5B6B6A}
.er{background:#FEE4E2;color:#B42318;border-radius:10px;padding:12px 14px;font-weight:600}
.nl{position:absolute;z-index:5;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid #CBD5D4;border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(18,51,46,.15)}
.nl li{padding:10px 12px;border-radius:8px;cursor:pointer}.nl li:hover,.nl li[aria-selected=true]{background:#E6F4F3}.nl small{display:block;color:#5B6B6A}
.in[readonly]{background:#F2F6F5}
@media(max-width:900px){.app{flex-direction:column}.sd{width:100%;flex-direction:row;align-items:center;padding:12px 16px;gap:12px;overflow-x:auto}.nv{flex-direction:row}.ml,.t2{display:none}.ni{white-space:nowrap;padding:10px 12px}.sa{margin:0 0 0 auto}.ph{padding:18px 16px 14px}.ct{padding:18px 16px}.f2{grid-template-columns:1fr}.cd{padding:16px}.ft{padding:16px}}
</style></head><body>
<div class="app"><aside class="sd">
<div class="sh"><img class="lm" src="logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'lm',textContent:'WM'}))"><div><div class="t1">WM Legal Hub</div><div class="t2">WM Center</div></div></div>
<nav class="nv"><div class="ml">MENU</div><a class="ni" href="#form">Ajukan Request</a><a class="ni" href="#pantau">Pantau Request</a><a class="ni" href="#panduan">Panduan</a></nav>
<div class="sa"><div class="ml">ADMIN</div><a class="ni" href="#admin">Login Admin</a></div></aside>
<main class="mn"><div id="v"></div><div class="ft">Ada pertanyaan? Hubungi <b>Legal WM Center</b> via WhatsApp <a href="https://wa.me/6285121394420">0851-2139-4420</a></div></main></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ====== ISI 2 BARIS INI ======
const API = 'https://script.google.com/macros/s/AKfycbyebEFCNVB6DlCrro2qMSATNgebRy-eefUW8QMzBai19oLoEDuyw6-mpcIb4CK3d1tI/exec';
const CLIENT_ID = '113626255388-sscgtea5u31dvevv48jb3dv2mlg0cjfv.apps.googleusercontent.com';
// =============================
const $ = s => document.querySelector(s), V = $('#v');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) : '–';
const ST = {Submitted:'sb','In Review':'sr','Menunggu Info':'sw','Dalam Pembuatan':'sm',Done:'sg'}, UR = {High:'uh',Medium:'um',Low:'ul'};
const badge = s => `<span class="bd ${ST[s]||'sb'}">${esc(s)}</span>`;
const get = (q = '') => fetch(API + q).then(r => r.json());
const post = b => fetch(API, {method:'POST', body:JSON.stringify(b)}).then(r => r.json());
const nw = n => { n = String(n).replace(/\D/g, ''); return n[0]=='0' ? '62'+n.slice(1) : n.slice(0,2)=='62' ? n : '62'+n; };
const wd = (a, b) => { let n = 0, d = new Date(a), e = new Date(b); d.setHours(0,0,0,0); e.setHours(0,0,0,0); while (d < e) { d.setDate(d.getDate()+1); if (d.getDay() != 0) n++; } return n; }; // hari kerja Senin-Sabtu
const rd = f => new Promise(ok => { const r = new FileReader(); r.onload = () => ok({name:f.name, type:f.type, data:r.result.split(',')[1]}); r.readAsDataURL(f); });
const head = (t, s) => `<div class="ph"><h1>${t}</h1><div class="mt">${s}</div></div>`;
const load = () => V.innerHTML = head('Memuat...', 'Mohon tunggu sebentar.');
const sorted = r => r.sort((a, b) => new Date(b.masuk) - new Date(a.masuk));
function stats(r) {
  const d = r.filter(x => x.status=='Done' && x.done).map(x => wd(x.masuk, x.done));
  return {total:r.length, nw:r.filter(x => x.status=='Submitted').length, rev:r.filter(x => !['Submitted','Done'].includes(x.status)).length,
    done:r.filter(x => x.status=='Done').length, sla:d.length ? Math.round(100*d.filter(n => n<=3).length/d.length)+'%' : '–',
    avg:d.length ? (d.reduce((a,b) => a+b, 0)/d.length).toFixed(1).replace('.', ',')+' <span class="mt">hari kerja</span>' : '–'};
}
const cards = a => `<div class="gc">${a.map(([l,v,c]) => `<div class="cd"><div class="mt">${l}</div><div class="n" style="color:${c||'inherit'}">${v}</div></div>`).join('')}</div>`;
const bars = (r, k) => { const m = {}; r.forEach(x => m[x[k]] = (m[x[k]]||0)+1); const e = Object.entries(m).sort((a,b) => b[1]-a[1]).slice(0,6), mx = e[0] ? e[0][1] : 1;
  return e.map(([n,c]) => `<div class="mt" style="margin-top:10px">${esc(n)} · ${c}</div><div style="height:10px;width:${100*c/mx}%;background:#0F7B6C;border-radius:6px"></div>`).join('') || '<div class="mt">Belum ada data</div>'; };

let EMP = [];
/* ---------- FORM ---------- */
function form() {
  V.innerHTML = head('Ajukan Request Legal', 'Isi form di bawah. Request akan diproses tim Legal WM Center.') + `<div class="ct" style="max-width:900px">
<div class="cd" style="background:#F4FBF9;border-color:#BFE3DD"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div style="font-size:18px;font-weight:800">Alur & Waktu Proses</div><div style="background:#0F7B6C;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;font-size:18px">3 hari kerja</div></div>
<div class="stp"><div class="st"><div class="ey">Hari 0</div><b>Request dikirim</b><div class="mt">Kamu dapat nomor request</div></div><div class="st"><div class="ey">Hari 1</div><b>Review Legal</b><div class="mt">Dicek, atau diminta info tambahan</div></div><div class="st"><div class="ey">Hari 2</div><b>Dokumen diproses</b><div class="mt">Disusun dan ditandatangani</div></div><div class="st dk"><div class="ey">Hari 3</div><b>Dokumen siap</b><div style="font-size:13px;color:#BFE3DD">Notifikasi via WhatsApp</div></div></div>
</div>
<form id="f" class="ct" style="padding:0;gap:20px"><div class="cd"><div style="font-size:16px;font-weight:800;margin-bottom:14px">1 · Data Pemohon</div><div class="f2">
<div style="position:relative"><label class="lb" for="nama">Nama</label><input class="in" id="nama" name="nama" required maxlength="100" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="nl" aria-autocomplete="list" placeholder="Ketik nama, lalu pilih"><ul class="nl" id="nl" role="listbox" hidden></ul></div>
<div><label class="lb" for="wa">No. WhatsApp</label><input class="in" id="wa" name="wa" required inputmode="tel" placeholder="0812xxxxxxxx" autocomplete="tel"><div class="mt" style="margin-top:4px">Notifikasi dokumen dikirim ke nomor ini.</div></div>
<div><label class="lb" for="divisi">Divisi</label><input class="in" id="divisi" name="divisi" required maxlength="100" placeholder="Terisi otomatis saat nama dipilih"></div>
<div><label class="lb" for="email">Email</label><input class="in" id="email" name="email" type="email" required placeholder="nama@wmcenter.id" autocomplete="email"></div></div></div>
<div class="cd"><div style="font-size:16px;font-weight:800;margin-bottom:14px">2 · Detail Request</div><div style="display:flex;flex-direction:column;gap:16px"><div class="f2">
<div><label class="lb" for="perihal">Perihal</label><input class="in" id="perihal" name="perihal" required maxlength="150" placeholder="Judul singkat"></div>
<div><label class="lb" for="jenis">Jenis permintaan</label><select class="in" id="jenis" name="jenis"><option>Review kontrak</option><option>Pembuatan PKS</option><option>Pembuatan surat</option><option>Konsultasi hukum</option><option>Perizinan / legalitas</option><option>Lainnya</option></select></div></div>
<div id="jl" hidden><label class="lb" for="jlain">Tuliskan jenis permintaan</label><input class="in" id="jlain" name="jlain" maxlength="100"></div>
<div><label class="lb" for="desk">Deskripsi singkat</label><textarea class="in" id="desk" name="desk" required maxlength="1500" placeholder="Latar belakang dan apa yang perlu dicek"></textarea></div>
<fieldset style="border:0;padding:0;margin:0"><legend class="lb">Urgency</legend><label class="ch"><input type="radio" name="urg" value="High" required> High</label><label class="ch"><input type="radio" name="urg" value="Medium"> Medium</label><label class="ch"><input type="radio" name="urg" value="Low"> Low</label></fieldset>
<div><label class="lb" for="dok">Upload dokumen (opsional)</label><input class="in" style="padding:9px 14px" id="dok" name="dok" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx"><div class="mt" style="margin-top:4px">PDF, DOC, DOCX, XLS, XLSX · maksimal 5 file, tiap file 10 MB</div></div>
<div id="msg" role="alert"></div><button class="bt" id="go" style="min-height:48px">Kirim request</button></div></div></form></div>`;
  const nm = $('#nama'), nl = $('#nl'), dv = $('#divisi'); let hit = [], ai = -1;
  get('?action=emp').then(r => { if (r.ok) EMP = r.emp; }).catch(() => {});
  const close = () => { nl.hidden = true; nm.setAttribute('aria-expanded', 'false'); ai = -1; };
  const pick = i => { const p = hit[i]; if (!p) return; nm.value = p[0]; dv.value = p[1]; dv.readOnly = true; close(); };
  const mark = () => [...nl.children].forEach((li, i) => li.setAttribute('aria-selected', i == ai));
  nm.oninput = () => {
    dv.readOnly = false; const q = nm.value.trim().toLowerCase();
    hit = q.length < 2 ? [] : EMP.filter(p => p[0].toLowerCase().includes(q)).slice(0, 8); ai = -1;
    nl.innerHTML = hit.map((p, i) => `<li role="option" data-i="${i}">${esc(p[0])}<small>${esc(p[1])}</small></li>`).join('');
    nl.hidden = !hit.length; nm.setAttribute('aria-expanded', String(!!hit.length));
  };
  nm.onkeydown = e => {
    if (nl.hidden) return;
    if (e.key == 'ArrowDown' || e.key == 'ArrowUp') { e.preventDefault(); const d = e.key == 'ArrowDown' ? 1 : -1; ai = ai < 0 ? (d > 0 ? 0 : hit.length - 1) : (ai + d + hit.length) % hit.length; mark(); }
    else if (e.key == 'Enter' && ai >= 0) { e.preventDefault(); pick(ai); } else if (e.key == 'Escape') close();
  };
  nl.onclick = e => { const li = e.target.closest('li'); if (li) pick(+li.dataset.i); };
  nm.onblur = () => setTimeout(close, 150);
  $('#jenis').onchange = e => { const o = e.target.value == 'Lainnya'; $('#jl').hidden = !o; $('#jlain').required = o; if (o) $('#jlain').focus(); };
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = e.target, fd = Object.fromEntries(new FormData(f)), fl = [...f.dok.files], m = $('#msg'), b = $('#go'); m.innerHTML = '';
    const n = nw(fd.wa); if (n.length < 10 || n.length > 15) return m.innerHTML = '<div class="er">Nomor WhatsApp tidak valid.</div>';
    if (fl.length > 5 || fl.some(x => x.size > 10e6) || fl.reduce((a, x) => a + x.size, 0) > 25e6) return m.innerHTML = '<div class="er">Maksimal 5 file, tiap file 10 MB, total 25 MB.</div>';
    b.disabled = true; b.textContent = 'Mengirim...';
    try {
      const r = await post({action:'submit', nama:fd.nama, divisi:fd.divisi, wa:n, email:fd.email, perihal:fd.perihal, jenis:fd.jenis == 'Lainnya' ? 'Lainnya: ' + fd.jlain.trim() : fd.jenis, desk:fd.desk, urg:fd.urg, files:await Promise.all(fl.map(rd))});
      if (!r.ok) throw new Error(r.error);
      V.innerHTML = head('Request terkirim', 'Tim Legal akan memprosesnya maksimal 3 hari kerja.') + `<div class="ct"><div class="cd"><div class="mt">Nomor request kamu</div><div class="n">${esc(r.id)}</div><p>Simpan nomor ini. Status bisa dipantau di menu Pantau Request, dan kamu akan dikabari lewat WhatsApp saat dokumen siap.</p><a class="bt" href="#pantau">Lihat Pantau Request</a></div></div>`;
    } catch (x) { m.innerHTML = `<div class="er">Gagal mengirim: ${esc(x.message)}. Coba lagi.</div>`; b.disabled = false; b.textContent = 'Kirim request'; }
  };
}

/* ---------- PANTAU (publik) ---------- */
let pm = 30;
async function pantau() {
  load(); let r; try { r = await get(); if (!r.ok) throw 0; } catch (x) { return V.innerHTML = head('Pantau Request Legal', '') + '<div class="ct"><div class="er">Data belum bisa dimuat. Coba muat ulang halaman.</div></div>'; }
  const rows = sorted(r.rows), s = stats(rows), show = rows.slice(0, pm);
  V.innerHTML = head('Pantau Request Legal', 'Terbaru di atas · SLA 3 hari kerja (Senin–Sabtu)') + `<div class="ct">${cards([['Total request', s.total], ['In Review', s.rev, '#1E40AF'], ['Done', s.done, '#065F46'], ['SLA terpenuhi', s.sla, '#0F7B6C']])}
<div class="cd" style="padding:8px 0 0"><div class="tw"><table style="min-width:560px"><tr><th>Tanggal masuk</th><th>Nama</th><th>Status</th><th>Tanggal selesai</th></tr>${show.map(x => `<tr><td>${fmt(x.masuk)}</td><td><b>${esc(x.nama)}</b></td><td>${badge(x.status)}</td><td>${fmt(x.done)}</td></tr>`).join('') || '<tr><td colspan="4" class="mt">Belum ada request.</td></tr>'}</table></div>
${rows.length > pm ? '<div style="padding:16px;text-align:center"><button class="bt b2" id="more">Lihat lebih banyak</button></div>' : ''}</div>
<div class="mt" style="text-align:center">Perihal dan dokumen tidak ditampilkan demi kerahasiaan.</div></div>`;
  if ($('#more')) $('#more').onclick = () => { pm += 30; pantau(); };
}

/* ---------- PANDUAN ---------- */
function panduan() {
  V.innerHTML = head('Panduan Request Legal', 'Cara mengajukan request ke Legal WM Center, dari awal sampai dokumen siap.') + `<div class="ct" style="max-width:900px">
<div class="cd"><div class="ey">Langkah</div><div style="font-size:18px;font-weight:800">Cara mengajukan request</div><div class="stp"><div class="st"><b>1. Buka form</b><div class="mt">Menu Ajukan Request</div></div><div class="st"><b>2. Isi data & detail</b><div class="mt">Lengkapi perihal dan deskripsi</div></div><div class="st"><b>3. Upload dokumen</b><div class="mt">Opsional, boleh banyak file</div></div><div class="st"><b>4. Pantau status</b><div class="mt">Cek di menu Pantau Request</div></div></div></div>
<div class="cd"><div style="font-size:18px;font-weight:800;margin-bottom:10px">Apa saja yang bisa diajukan</div><div class="mt" style="line-height:1.9">Review kontrak · Pembuatan PKS · Pembuatan surat · Konsultasi hukum · Perizinan / legalitas · Lainnya</div></div>
<div class="cd"><div style="font-size:18px;font-weight:800;margin-bottom:12px">Arti tiap status</div><div style="display:flex;flex-direction:column;gap:12px"><div>${badge('Submitted')} <span class="mt">Request masuk, belum dibuka Legal.</span></div><div>${badge('In Review')} <span class="mt">Sedang dikaji Legal.</span></div><div>${badge('Menunggu Info')} <span class="mt">Legal butuh klarifikasi dari kamu.</span></div><div>${badge('Dalam Pembuatan')} <span class="mt">Dokumen sedang disusun.</span></div><div>${badge('Done')} <span class="mt">Selesai, dokumen bisa diunduh.</span></div></div></div>
<div class="cd"><div style="font-size:18px;font-weight:800;margin-bottom:8px">Waktu penyelesaian 3 hari kerja</div><ul class="mt" style="margin:0;padding-left:18px;line-height:1.8"><li>Hari kerja adalah Senin–Sabtu.</li><li>Notifikasi selesai dikirim lewat WhatsApp Legal WM Center.</li></ul></div>
<div class="cd" style="background:#12332E;color:#fff"><div style="font-size:18px;font-weight:800">Ada pertanyaan?</div><div style="color:#BFE3DD;margin:6px 0 14px">Hubungi Legal WM Center di WhatsApp 0851-2139-4420.</div><a class="bt" style="background:#fff;color:#12332E" href="https://wa.me/6285121394420">Chat Legal via WhatsApp</a></div></div>`;
}

/* ---------- ADMIN ---------- */
const S = {tok:sessionStorage.getItem('t') || '', rows:[], f:'open', more:30};
const row = id => S.rows.find(x => x.id == id);
function gsi(fn) { window.google && google.accounts ? fn() : setTimeout(() => gsi(fn), 200); }
function login(err) {
  V.innerHTML = head('Login Admin', 'Khusus HR & Legal. Masuk dengan akun Google kantor.') + `<div class="ct" style="max-width:520px">${err ? `<div class="er">${esc(err)}</div>` : ''}<div class="cd"><p style="margin-top:0">Hanya email yang terdaftar sebagai admin yang bisa membuka dashboard.</p><div id="gb"></div></div></div>`;
  gsi(() => { google.accounts.id.initialize({client_id:CLIENT_ID, callback:r => { S.tok = r.credential; sessionStorage.setItem('t', S.tok); admin(); }}); google.accounts.id.renderButton($('#gb'), {theme:'outline', size:'large', text:'signin_with'}); });
}
async function admin() {
  if (!S.tok) return login(); load();
  let r; try { r = await post({action:'list', token:S.tok}); } catch (x) { return login('Gagal terhubung ke server.'); }
  if (!r.ok) { S.tok = ''; sessionStorage.removeItem('t'); return login(r.error == 'auth' ? 'Sesi habis atau email ini tidak punya akses. Silakan login lagi.' : r.error); }
  S.rows = sorted(r.rows); S.me = r.me; adminView();
}
function adminView() {
  const s = stats(S.rows), fl = {open:x => x.status != 'Done', done:x => x.status == 'Done', new:x => x.status == 'Submitted', all:() => true}[S.f], list = S.rows.filter(fl), show = list.slice(0, S.more);
  const tab = (k, l, n) => `<button data-act="tab" data-v="${k}" class="${S.f == k ? 'on' : ''}">${l} ${n}</button>`;
  V.innerHTML = `<div class="ph" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h1>Dashboard Admin</h1><div class="mt">Rekap request legal, khusus HR & Legal.</div></div><div class="mt">${esc(S.me)} · <a href="#" data-act="out">Keluar</a></div></div><div class="ct">
${s.nw ? `<div class="cd" style="border-top:3px solid #C77700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><b style="font-size:16px">Menunggu review</b><div class="mt">${s.nw} request baru belum dilihat</div></div><button class="bt" data-act="tab" data-v="new">Review</button></div>` : ''}
${cards([['Belum dilihat', s.nw], ['In Review', s.rev, '#1E40AF'], ['Done', s.done, '#065F46'], ['SLA terpenuhi', s.sla, '#0F7B6C'], ['Rata-rata selesai', s.avg]])}
<div class="f2"><div class="cd"><b>Request per divisi</b>${bars(S.rows, 'divisi')}</div><div class="cd"><b>Request per jenis</b>${bars(S.rows.map(x => ({...x, jenis:String(x.jenis).split(':')[0]})), 'jenis')}</div></div>
<div class="cd" style="padding:18px 0 0"><div class="tb">${tab('open','Belum selesai',S.rows.filter(x => x.status != 'Done').length)}${tab('new','Belum dilihat',s.nw)}${tab('done','Selesai',s.done)}${tab('all','Semua',s.total)}</div>
<div class="tw"><table style="min-width:1000px"><tr><th>Tanggal</th><th>Requester</th><th>Perihal</th><th>Urgency</th><th>Dokumen</th><th>Status & surat</th><th>Notif</th></tr>${show.map(r => {
    let docs = []; try { docs = JSON.parse(r.docs || '[]'); } catch (x) {}
    return `<tr><td>${fmt(r.masuk)}</td><td><b>${esc(r.nama)}</b><div class="mt">${esc(r.divisi)}</div></td>
<td><details><summary>${esc(r.perihal)}</summary><div class="mt" style="margin-top:6px">${esc(r.id)} · ${esc(r.jenis)}<br>${esc(r.desk)}<br>${esc(r.email)} · ${esc(r.wa)}</div></details></td>
<td><span class="bd ${UR[r.urg] || 'sb'}">${esc(r.urg)}</span></td><td>${docs.map(d => `<div><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a></div>`).join('') || '<span class="mt">–</span>'}</td>
<td><div class="dr"><select class="in" aria-label="Status" data-act="st" data-id="${esc(r.id)}">${Object.keys(ST).map(o => `<option${o == r.status ? ' selected' : ''}>${o}</option>`).join('')}</select>
<label class="bt b2">${r.suratUrl ? 'Ganti file' : '+ Add file'}<input class="vh" type="file" accept=".pdf,.doc,.docx" data-act="fl" data-id="${esc(r.id)}"></label></div>
${r.suratUrl ? `<div style="margin-top:6px"><a class="bd sg" href="${esc(r.suratUrl)}" target="_blank" rel="noopener">${esc(r.suratNama)}</a></div>` : ''}</td>
<td><button class="bt bw" data-act="wa" data-id="${esc(r.id)}"${r.suratUrl ? '' : ' disabled'}>Kabari WA</button>${r.notified ? `<div class="mt" style="margin-top:4px">Dikabari ${fmt(r.notified)}</div>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="mt">Tidak ada request.</td></tr>'}</table></div>
${list.length > S.more ? '<div style="padding:16px;text-align:center"><button class="bt b2" data-act="more">Lihat lebih banyak</button></div>' : ''}</div></div>`;
}
V.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !t.dataset.act) return; const a = t.dataset.act;
  if (a == 'out') { e.preventDefault(); S.tok = ''; sessionStorage.removeItem('t'); login(); }
  if (a == 'tab') { S.f = t.dataset.v; S.more = 30; adminView(); }
  if (a == 'more') { S.more += 30; adminView(); }
  if (a == 'wa') {
    const r = row(t.dataset.id), msg = `Halo ${r.nama},\n\nRequest legal Anda "${r.perihal}" (No. ${r.noSurat || r.id}) sudah selesai ✅.\nDokumen bisa diunduh di sini: ${r.suratUrl}.\nApabila ada pertanyaan, silakan ditanyakan ya.\n\nRegards,\nLegal WM Center`;
    window.open('https://wa.me/' + nw(r.wa) + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
    (async () => {
      if (r.status != 'Done') { const u = await post({action:'update', token:S.tok, id:r.id, status:'Done'}); if (u.ok) { r.status = 'Done'; r.done = u.done; } }
      const n = await post({action:'notified', token:S.tok, id:r.id}); if (n.ok) r.notified = n.at; adminView();
    })();
  }
});
V.addEventListener('change', async e => {
  const t = e.target, r = row(t.dataset.id); if (!r) return;
  if (t.dataset.act == 'st') {
    const u = await post({action:'update', token:S.tok, id:r.id, status:t.value});
    if (u.ok) { r.status = t.value; r.done = u.done; adminView(); } else { alert(u.error); adminView(); }
  }
  if (t.dataset.act == 'fl' && t.files[0]) {
    const f = t.files[0]; if (f.size > 10e6) { t.value = ''; return alert('Maksimal 10 MB.'); }
    const no = prompt('No surat (opsional):', r.noSurat || ''); if (no === null) { t.value = ''; return; }
    t.parentElement.firstChild.textContent = 'Mengunggah...';
    const u = await post({action:'final', token:S.tok, id:r.id, noSurat:no, file:await rd(f)});
    if (u.ok) { r.suratNama = u.name; r.suratUrl = u.url; r.noSurat = u.noSurat; } else alert(u.error);
    adminView();
  }
});

/* ---------- ROUTER ---------- */
const R = {form, pantau, panduan, admin};
function route() { const k = (location.hash || '#form').slice(1); document.querySelectorAll('.ni').forEach(a => a.classList.toggle('on', a.hash == '#' + k)); (R[k] || form)(); scrollTo(0, 0); }
addEventListener('hashchange', route); route();
</script></body></html>
